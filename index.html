        musicaFondo: new Audio('sonidos/musicaFondo_1.mp3'),
        musicaInicio: new Audio('sonidos/musicaInicio_1.mp3')
      };

      // Configurar loops
      sounds.viento.loop = true;
      sounds.nieve.loop = true;
      sounds.noche.loop = true;
      sounds.musicaFondo.loop = true;
      sounds.musicaInicio.loop = true;

      // Configurar volúmenes
      sounds.viento.volume = 0.5;
      sounds.nieve.volume = 0.3;
      sounds.noche.volume = 0.3;
      sounds.musicaFondo.volume = 0.2;
      sounds.musicaInicio.volume = 0.3;

      // Cola de reproducción de sonidos para evitar sobrecarga de promesas
      const soundQueue = [];
      let isProcessingSound = false;

      async function processSoundQueue() {
        if (isProcessingSound || soundQueue.length === 0) return;
        isProcessingSound = true;
        
        const audio = soundQueue.shift();
        try {
          audio.currentTime = 0;
          await audio.play();
        } catch (e) {
          // Silenciar errores de reproducción (autoplay policy, etc.)
        } finally {
          isProcessingSound = false;
          if (soundQueue.length > 0) processSoundQueue();
        }
      }

      function playSound(audio) {
        if (!state.sonidoActivado || state.juegoPausado) return;
        soundQueue.push(audio);
        if (!isProcessingSound) processSoundQueue();
      }

      function stopSound(audio) {
        try {
          audio.pause();
          audio.currentTime = 0;
        } catch (e) {}
      }

      function stopAllAmbientSounds() {
        stopSound(sounds.viento);
        stopSound(sounds.nieve);
        stopSound(sounds.noche);
      }

      // ==================== FUNCIONES DE UTILIDAD ====================
      function sanitizeName(name) {
        return name.replace(/[^a-zA-Z0-9 ]/g, '').substring(0, 20) || 'Jugador';
      }

      function updateHUD() {
        const ahora = Date.now();
        
        if (isMobile) {
          const nombreCorto = state.nombreJugador.length > 8 ? state.nombreJugador.substring(0, 5).toUpperCase() : state.nombreJugador.toUpperCase();
          
          document.getElementById('mobile-player').textContent = `👮‍♂️: ${nombreCorto}`;
          document.getElementById('mobile-score').textContent = `💎: ${state.score}`;
          document.getElementById('mobile-level').textContent = `🏆: ${state.level}`;
          document.getElementById('mobile-lives').textContent = `♥️: ${state.vidas}`;
          
          if (ahora - state.tiempoBloqueoChalecos < 10000) {
            const tiempoRestante = Math.ceil((10000 - (ahora - state.tiempoBloqueoChalecos)) / 1000);
            document.getElementById('mobile-shields').textContent = `🛡️: BLOQ(${tiempoRestante}s)`;
          } else {
            document.getElementById('mobile-shields').textContent = `🛡️: ${state.escudosRecolectados}/${CONFIG.MAX_ESCUDOS}`;
          }
          
          document.getElementById('mobile-plates').textContent = `🟡: ${state.placasRecolectadasDesdeUltimaVida}/${state.placasParaVida}`;
          
          const progress = Math.min(100, (state.score / (state.level * CONFIG.SCORE_PER_LEVEL)) * 100);
          document.getElementById('mobile-next-level-bar').style.width = `${progress}%`;
          document.getElementById('mobile-nitro-bar').style.width = `${state.nitro}%`;
          
          const mobileCombo = document.getElementById('mobile-combo');
          if (mobileCombo) {
            if (state.combo > 1) {
              mobileCombo.textContent = `COMBO x${state.combo}`;
              mobileCombo.style.display = 'block';
              mobileCombo.style.backgroundColor = state.combo > 3 ? 'rgba(255, 215, 0, 0.9)' : 'rgba(255, 255, 255, 0.7)';
            } else {
              mobileCombo.style.display = 'none';
            }
          }
        } else {
          document.getElementById('desktop-player').textContent = state.nombreJugador;
          document.getElementById('desktop-score').textContent = state.score;
          document.getElementById('desktop-level').textContent = state.level;
          document.getElementById('desktop-highscore').textContent = state.highScore;
          document.getElementById('desktop-nitro-progress').style.width = `${state.nitro}%`;
          document.getElementById('desktop-plates').textContent = `${state.placasRecolectadasDesdeUltimaVida}/${state.placasParaVida}`;
          document.getElementById('desktop-plates-progress').style.width = `${(state.placasRecolectadasDesdeUltimaVida / state.placasParaVida) * 100}%`;
          
          if (ahora - state.tiempoBloqueoChalecos < 10000) {
            const tiempoRestante = Math.ceil((10000 - (ahora - state.tiempoBloqueoChalecos)) / 1000);
            document.getElementById('desktop-shields').textContent = `BLOQ (${tiempoRestante}s)`;
            document.getElementById('desktop-shields').style.color = 'red';
          } else {
            document.getElementById('desktop-shields').textContent = `${state.escudosRecolectados}/${CONFIG.MAX_ESCUDOS}`;
            document.getElementById('desktop-shields').style.color = 'white';
          }
          document.getElementById('desktop-shields-progress').style.width = `${(state.escudosRecolectados / CONFIG.MAX_ESCUDOS) * 100}%`;
          
          const progress = Math.min(100, (state.score / (state.level * CONFIG.SCORE_PER_LEVEL)) * 100);
          document.getElementById('desktop-level-progress').style.width = `${progress}%`;
          
          const livesContainer = document.getElementById('desktop-lives');
          livesContainer.innerHTML = '';
          for (let i = 0; i < state.vidas; i++) {
            const life = document.createElement('div');
            life.className = 'life';
            livesContainer.appendChild(life);
          }
          
          const comboContainer = document.getElementById('desktop-combo-container');
          const comboEl = document.getElementById('desktop-combo');
          if (state.combo > 1) {
            comboContainer.style.display = 'block';
            comboEl.textContent = `x${state.combo}`;
            comboContainer.style.backgroundColor = state.combo > 3 ? 'rgba(255, 215, 0, 0.3)' : 'rgba(255, 255, 255, 0.1)';
          } else {
            comboContainer.style.display = 'none';
          }
        }
      }

      // ==================== CONTROLES ====================
      let moveInterval = null;
      let leftActive = false;
      let rightActive = false;

      function handleContinuousMove() {
        if (leftActive) {
          state.patrulla.targetX = Math.max(CONFIG.LEFT_BORDER + CONFIG.BORDER_WIDTH, state.patrulla.targetX - 5);
        }
        if (rightActive) {
          state.patrulla.targetX = Math.min(CONFIG.RIGHT_BORDER - CONFIG.BORDER_WIDTH - state.patrulla.width, state.patrulla.targetX + 5);
        }
      }

      function setupControls() {
        if (isMobile) {
          const leftZone = document.getElementById('left-zone');
          const rightZone = document.getElementById('right-zone');
          const btnNitro = document.getElementById('btnNitro');
          const btnLeft = document.getElementById('btnLeft');
          const btnRight = document.getElementById('btnRight');
          
          const startMove = (direction) => {
            return (e) => {
              e.preventDefault();
              if (direction === 'left') leftActive = true;
              if (direction === 'right') rightActive = true;
              if (!moveInterval) moveInterval = setInterval(handleContinuousMove, 16);
            };
          };
          
          const stopMove = (direction) => {
            return (e) => {
              e.preventDefault();
              if (direction === 'left') leftActive = false;
              if (direction === 'right') rightActive = false;
              if (!leftActive && !rightActive && moveInterval) {
                clearInterval(moveInterval);
                moveInterval = null;
              }
            };
          };

          // Zonas táctiles
          leftZone.addEventListener('touchstart', startMove('left'), { passive: false });
          leftZone.addEventListener('touchend', stopMove('left'), { passive: false });
          leftZone.addEventListener('touchcancel', stopMove('left'), { passive: false });
          
          rightZone.addEventListener('touchstart', startMove('right'), { passive: false });
          rightZone.addEventListener('touchend', stopMove('right'), { passive: false });
          rightZone.addEventListener('touchcancel', stopMove('right'), { passive: false });

          // Botones direccionales
          btnLeft.addEventListener('touchstart', startMove('left'), { passive: false });
          btnLeft.addEventListener('touchend', stopMove('left'), { passive: false });
          btnLeft.addEventListener('touchcancel', stopMove('left'), { passive: false });
          
          btnRight.addEventListener('touchstart', startMove('right'), { passive: false });
          btnRight.addEventListener('touchend', stopMove('right'), { passive: false });
          btnRight.addEventListener('touchcancel', stopMove('right'), { passive: false });

          // Nitro
          btnNitro.addEventListener('touchstart', (e) => {
            e.preventDefault();
            activarNitro();
          }, { passive: false });
          
          btnNitro.addEventListener('touchend', (e) => {
            e.preventDefault();
            desactivarNitro();
          }, { passive: false });
          
          btnNitro.addEventListener('touchcancel', (e) => {
            e.preventDefault();
            desactivarNitro();
          }, { passive: false });
        }
      }

      // ==================== NITRO ====================
      let nitroConsumptionInterval = null;

      function activarNitro() {
        if (state.nitro > 0 && !state.nitroActivo && !state.juegoPausado) {
          state.nitroActivo = true;
          state.speed += CONFIG.NITRO_BOOST;
          
          if (!state.nitroSoundPlaying && state.sonidoActivado) {
            playSound(sounds.nitro);
            state.nitroSoundPlaying = true;
          }
          
          if (nitroConsumptionInterval) clearInterval(nitroConsumptionInterval);
          nitroConsumptionInterval = setInterval(() => {
            if (state.nitroActivo && state.nitro > 0 && !state.juegoPausado) {
              state.nitro = Math.max(0, state.nitro - CONFIG.NITRO_CONSUME_RATE);
              if (state.nitro <= 0) desactivarNitro();
              updateHUD();
            }
          }, 50);
        }
      }

      function desactivarNitro() {
        if (state.nitroActivo) {
          state.nitroActivo = false;
          state.speed = Math.max(CONFIG.INITIAL_SPEED, state.speed - CONFIG.NITRO_BOOST);
          
          if (state.nitroSoundPlaying) {
            stopSound(sounds.nitro);
            state.nitroSoundPlaying = false;
          }
          
          if (nitroConsumptionInterval) {
            clearInterval(nitroConsumptionInterval);
            nitroConsumptionInterval = null;
          }
          
          if (state.sonidoActivado) playSound(sounds.frenoDerrape);
          crearEfectoDerrape();
        }
      }

      function crearEfectoDerrape() {
        const centerX = state.patrulla.x + state.patrulla.width / 2;
        const wheelWidth = 10;
        
        if (state.derrapeMarks.length < CONFIG.MAX_DERRAPE_MARKS - 2) {
          state.derrapeMarks.push({
            x1: centerX - wheelWidth, y1: state.patrulla.y + state.patrulla.height,
            x2: centerX - wheelWidth, y2: state.patrulla.y + state.patrulla.height + 30 + Math.random() * 20,
            width: 3 + Math.random() * 2, alpha: 0.8
          });
          state.derrapeMarks.push({
            x1: centerX + wheelWidth, y1: state.patrulla.y + state.patrulla.height,
            x2: centerX + wheelWidth, y2: state.patrulla.y + state.patrulla.height + 30 + Math.random() * 20,
            width: 3 + Math.random() * 2, alpha: 0.8
          });
        }
        
        for (let i = 0; i < 15 && state.humoParticles.length < CONFIG.MAX_PARTICULAS; i++) {
          state.humoParticles.push({
            x: centerX + (Math.random() - 0.5) * wheelWidth * 1.5,
            y: state.patrulla.y + state.patrulla.height - 5 + Math.random() * 30,
            size: 5 + Math.random() * 15, alpha: 0.6,
            speedX: (Math.random() - 0.5) * 2, speedY: -Math.random() * 2,
            decay: 0.01 + Math.random() * 0.03
          });
        }
        
        state.shakeFrames = 5;
      }

      // ==================== CLIMA ====================
      function cambiarClima() {
        const ahora = Date.now();
        
        if (state.tiempoDuracionClima === 0) {
          state.tiempoDuracionClima = 15000 + Math.random() * 15000;
        }
        
        if (ahora - state.tiempoCambioClima > state.tiempoDuracionClima) {
          const climas = ['normal', 'niebla', 'tormenta', 'viento', 'nieve', 'arena', 'granizo', 'noche'];
          state.climaActual = climas[Math.floor(Math.random() * climas.length)];
          
          if (state.climaActual === 'granizo') {
            const opciones = ['nieve', 'lluvia'];
            state.climaSecundario = opciones[Math.floor(Math.random() * opciones.length)];
          } else if (state.climaActual === 'tormenta') {
            state.climaSecundario = 'lluvia';
          } else {
            state.climaSecundario = null;
          }
          
          state.tiempoDuracionClima = 15000 + Math.random() * 15000;
          state.tiempoCambioClima = ahora;
          
          // Limpiar partículas anteriores
          state.hojas = [];
          state.copos = [];
          state.arena = [];
          state.granizos = [];
          state.gotas = [];
          state.rayos = [];
          state.crateres = [];
          state.particulasRayos = [];
          state.particulasCrateres = [];
          
          state.nieblaActiva = state.climaActual === 'niebla';
          state.nocheActiva = state.climaActual === 'noche';
          state.vientoActivo = state.climaActual === 'viento';
          
          stopAllAmbientSounds();
          
          if (state.sonidoActivado) {
            if (state.climaActual === 'viento') playSound(sounds.viento);
            else if (state.climaActual === 'nieve' || (state.climaActual === 'granizo' && state.climaSecundario === 'nieve')) playSound(sounds.nieve);
            else if (state.climaActual === 'noche') playSound(sounds.noche);
          }
        }
      }

      function spawnNieve() {
        if (state.climaActual === 'nieve' || (state.climaActual === 'granizo' && state.climaSecundario === 'nieve')) {
          if (Math.random() < 0.3 && state.copos.length < CONFIG.MAX_PARTICULAS) {
            for (let i = 0; i < 2 + Math.floor(Math.random() * 3); i++) {
              if (state.copos.length < CONFIG.MAX_PARTICULAS) {
                state.copos.push({
                  x: Math.random() * CONFIG.CANVAS_WIDTH,
                  y: -5,
                  speed: 1 + Math.random() * 2,
                  size: 2 + Math.random() * 3
                });
              }
            }
          }
        }
      }

      function spawnGranizo() {
        if (state.climaActual === 'granizo' && state.granizos.length < CONFIG.MAX_PARTICULAS) {
          if (Math.random() < 0.03) {
            state.granizos.push({
              x: Math.random() * CONFIG.CANVAS_WIDTH,
              y: -10,
              speed: 5 + Math.random() * 4,
              size: 5 + Math.random() * 5
            });
          }
        }
      }

      // ==================== OBJETOS ====================
      function spawnObstacle() {
        if (Math.random() < 0.02) {
          const minX = CONFIG.LEFT_BORDER + CONFIG.BORDER_WIDTH;
          const maxX = CONFIG.RIGHT_BORDER - CONFIG.BORDER_WIDTH - 30;
          const x = Math.random() * (maxX - minX) + minX;
          const width = 30 + Math.random() * 20;
          const height = 30 + Math.random() * 20;
          state.obstacles.push({ x, y: -height, width, height });
        }
      }

      function spawnObjetivo() {
        if (Math.random() < 0.03) {
          const minX = CONFIG.LEFT_BORDER + CONFIG.BORDER_WIDTH;
          const maxX = CONFIG.RIGHT_BORDER - CONFIG.BORDER_WIDTH - 30;
          const x = Math.random() * (maxX - minX) + minX;
          state.objetivos.push({ x, y: -30, width: 30, height: 30 });
        }
      }

      function spawnPowerup() {
        if (Math.random() < 0.01) {
          const minX = CONFIG.LEFT_BORDER + CONFIG.BORDER_WIDTH;
          const maxX = CONFIG.RIGHT_BORDER - CONFIG.BORDER_WIDTH - 30;
          const x = Math.random() * (maxX - minX) + minX;
          state.powerups.push({ x, y: -30, width: 30, height: 30 });
        }
      }

      function spawnAceite() {
        if (state.level >= 3 && Math.random() < 0.005) {
          const minX = CONFIG.LEFT_BORDER + CONFIG.BORDER_WIDTH;
          const maxX = CONFIG.RIGHT_BORDER - CONFIG.BORDER_WIDTH - 30;
          const x = Math.random() * (maxX - minX) + minX;
          state.aceites.push({ x, y: -10, size: 15 + Math.random() * 15 });
        }
      }

      function spawnNitroItem() {
        const ahora = Date.now();
        if (state.level >= 1 && ahora - state.tiempoUltimoNitroItem > state.nitroItemIntervalo && 
            state.nitroItems.length === 0 && state.nitro < 80) {
          if (Math.random() < 0.05) {
            const minX = CONFIG.LEFT_BORDER + CONFIG.BORDER_WIDTH;
            const maxX = CONFIG.RIGHT_BORDER - CONFIG.BORDER_WIDTH - 30;
            const x = Math.random() * (maxX - minX) + minX;
            state.nitroItems.push({ x, y: -30 });
            state.tiempoUltimoNitroItem = ahora;
          }
        }
      }

      function spawnVidaItem() {
        if (state.vidas < 3 && state.placasRecolectadasDesdeUltimaVida >= state.placasParaVida) {
          const minX = CONFIG.LEFT_BORDER + CONFIG.BORDER_WIDTH;
          const maxX = CONFIG.RIGHT_BORDER - CONFIG.BORDER_WIDTH - 30;
          const x = Math.random() * (maxX - minX) + minX;
          state.vidaItems.push({ x, y: -30 });
          state.placasRecolectadasDesdeUltimaVida = 0;
          updateHUD();
        }
      }

      function spawnTrampaClavos() {
        if (state.level >= 5 && Math.random() < 0.003 && state.trampaClavosItems.length === 0) {
          const minX = CONFIG.LEFT_BORDER + CONFIG.BORDER_WIDTH;
          const maxX = CONFIG.RIGHT_BORDER - CONFIG.BORDER_WIDTH - 30;
          const x = Math.random() * (maxX - minX) + minX;
          const seMueveLateralmente = state.level > 8;
          state.trampaClavosItems.push({ 
            x, y: -30, width: 30, height: 30,
            rotation: 0, rotationSpeed: (Math.random() - 0.5) * 0.2,
            slideDirection: seMueveLateralmente ? (Math.random() > 0.5 ? 1 : -1) : 0,
            seMueve: seMueveLateralmente
          });
        }
      }

      function spawnCono() {
        if (state.level >= 2 && Math.random() < 0.003) {
          const minX = CONFIG.LEFT_BORDER + CONFIG.BORDER_WIDTH;
          const maxX = CONFIG.RIGHT_BORDER - CONFIG.BORDER_WIDTH - 30;
          const x = Math.random() * (maxX - minX) + minX;
          state.conos.push({ x, y: -30, width: 20, height: 30 });
        }
      }

      // ==================== COLISIONES (OPTIMIZADA) ====================
      async function checkCollisions() {
        const ahora = Date.now();
        const invulnerable = ahora - state.tiempoUltimoChoque < CONFIG.TIEMPO_INVULNERABLE;
        let danioAplicado = false;

        // Objetivos (placas)
        for (let i = state.objetivos.length - 1; i >= 0; i--) {
          const obj = state.objetivos[i];
          if (checkRectCollision(state.patrulla, obj)) {
            state.objetivos.splice(i, 1);
            
            if (ahora - state.tiempoUltimaPlaca < CONFIG.TIEMPO_RESET_COMBO) {
              state.combo++;
              state.maxCombo = Math.max(state.maxCombo, state.combo);
            } else {
              state.combo = 1;
            }
            
            state.tiempoUltimaPlaca = ahora;
            state.score += 100 * state.combo;
            state.placasRecolectadasDesdeUltimaVida++;
            
            if (state.sonidoActivado) playSound(sounds.punto);
            
            if (state.placasRecolectadasDesdeUltimaVida >= state.placasParaVida) {
              spawnVidaItem();
            }
            
            updateHUD();
          }
        }

        // Powerups (escudos)
        for (let i = state.powerups.length - 1; i >= 0; i--) {
          const pw = state.powerups[i];
          if (checkRectCollision(state.patrulla, pw)) {
            state.powerups.splice(i, 1);
            
            if (state.escudosRecolectados < CONFIG.MAX_ESCUDOS && ahora - state.tiempoBloqueoChalecos > 10000) {
              state.escudosRecolectados++;
              if (state.sonidoActivado) playSound(sounds.powerup);
            } else {
              state.score += 200;
              if (state.sonidoActivado) playSound(sounds.punto);
            }
            
            updateHUD();
          }
        }

        // Nitro items
        for (let i = state.nitroItems.length - 1; i >= 0; i--) {
          const item = state.nitroItems[i];
          if (checkRectCollision(state.patrulla, { x: item.x, y: item.y, width: 30, height: 30 })) {
            state.nitroItems.splice(i, 1);
            state.nitro = Math.min(100, state.nitro + 30);
            if (state.sonidoActivado) playSound(sounds.powerup);
            updateHUD();
          }
        }

        // Vida items
        for (let i = state.vidaItems.length - 1; i >= 0; i--) {
          const item = state.vidaItems[i];
          if (checkRectCollision(state.patrulla, { x: item.x, y: item.y, width: 30, height: 30 })) {
            state.vidaItems.splice(i, 1);
            state.vidas = Math.min(3, state.vidas + 1);
            if (state.sonidoActivado) playSound(sounds.vida);
            updateHUD();
          }
        }

        // Trampas de clavos
        for (let i = state.trampaClavosItems.length - 1; i >= 0; i--) {
          const item = state.trampaClavosItems[i];
          if (checkRectCollision(state.patrulla, item)) {
            state.trampaClavosItems.splice(i, 1);
            
            if (state.escudosRecolectados > 0 && !danioAplicado) {
              state.escudosRecolectados--;
              if (state.sonidoActivado) playSound(sounds.antiPowerup);
            } else if (!invulnerable && !danioAplicado) {
              state.vidas--;
              state.combo = 0;
              state.shakeFrames = 10;
              state.tiempoUltimoChoque = ahora;
              danioAplicado = true;
              if (state.sonidoActivado) playSound(sounds.trampaClavos);
            }
            
            if (state.vidas <= 0) gameOverHandler();
            updateHUD();
          }
        }

        // Conos
        for (let i = state.conos.length - 1; i >= 0; i--) {
          const cono = state.conos[i];
          if (checkRectCollision(state.patrulla, cono)) {
            state.conos.splice(i, 1);
            
            if (state.escudosRecolectados > 0 && !danioAplicado) {
              state.escudosRecolectados--;
              if (state.sonidoActivado) playSound(sounds.antiPowerup);
            } else if (!invulnerable && !danioAplicado) {
              state.vidas--;
              state.combo = 0;
              state.shakeFrames = 10;
              state.tiempoUltimoChoque = ahora;
              danioAplicado = true;
              if (state.sonidoActivado) playSound(sounds.cono);
            }
            
            if (state.vidas <= 0) gameOverHandler();
            updateHUD();
          }
        }

        // Aceite
        for (let i = state.aceites.length - 1; i >= 0; i--) {
          const aceite = state.aceites[i];
          if (checkCircleRectCollision(aceite, state.patrulla)) {
            if (state.escudosRecolectados === 0 && !invulnerable && !state.deslizando && !danioAplicado) {
              state.deslizando = true;
              state.tiempoDeslizamiento = ahora;
              if (state.sonidoActivado) playSound(sounds.aceite);
              crearEfectoDerrape();
            }
            state.aceites.splice(i, 1);
          }
        }

        // Obstáculos
        for (let i = state.obstacles.length - 1; i >= 0; i--) {
          const obs = state.obstacles[i];
          if (checkRectCollision(state.patrulla, obs)) {
            if (!invulnerable && !danioAplicado) {
              if (state.escudosRecolectados > 0) {
                state.escudosRecolectados--;
                if (state.sonidoActivado) playSound(sounds.antiPowerup);
              } else {
                state.vidas--;
                state.combo = 0;
                state.shakeFrames = 15;
                state.tiempoUltimoChoque = ahora;
                danioAplicado = true;
                if (state.sonidoActivado) playSound(sounds.choque);
              }
              
              if (state.vidas <= 0) gameOverHandler();
              updateHUD();
            }
            state.obstacles.splice(i, 1);
          }
        }
      }

      function checkRectCollision(r1, r2) {
        return r1.x < r2.x + r2.width &&
               r1.x + r1.width > r2.x &&
               r1.y < r2.y + r2.height &&
               r1.y + r1.height > r2.y;
      }

      function checkCircleRectCollision(circle, rect) {
        const closestX = Math.max(rect.x, Math.min(circle.x, rect.x + rect.width));
        const closestY = Math.max(rect.y, Math.min(circle.y, rect.y + rect.height));
        const dx = circle.x - closestX;
        const dy = circle.y - closestY;
        return (dx * dx + dy * dy) < circle.size * circle.size;
      }

      function gameOverHandler() {
        state.gameOver = true;
        stopSound(sounds.musicaFondo);
        stopAllAmbientSounds();
        desactivarNitro();
        
        document.getElementById('gameOverScreen').style.display = 'flex';
        document.getElementById('btnReiniciar').style.display = 'block';
        document.getElementById('puntosFinales').textContent = `Puntos: ${state.score}`;
        document.getElementById('highScoreFinal').textContent = `Récord: ${state.highScore}`;
        document.getElementById('maxComboFinal').textContent = `Máximo Combo: x${state.maxCombo}`;
      }

      // ==================== ACTUALIZACIONES ====================
      function checkLevelUp() {
        if (state.score >= state.level * CONFIG.SCORE_PER_LEVEL) {
          state.level++;
          state.speed = Math.min(CONFIG.MAX_SPEED, state.speed + 0.5);
          state.tiempoUltimoLevelUp = Date.now();
          
          if (state.level % 3 === 0) {
            state.nitroItemIntervalo = Math.max(5000, state.nitroItemIntervalo - 1000);
          }
          
          if (state.level % 5 === 0) {
            state.placasParaVida = Math.max(20, state.placasParaVida - 5);
          }
          
          updateHUD();
        }
      }

      function cleanUpObjects() {
        // Combinar filtrado en una sola pasada (evitar múltiples iteraciones)
        const altura = CONFIG.CANVAS_HEIGHT;
        
        state.objetivos = state.objetivos.filter(obj => obj.y < altura);
        state.obstacles = state.obstacles.filter(obs => obs.y < altura);
        state.powerups = state.powerups.filter(pw => pw.y < altura);
        state.aceites = state.aceites.filter(aceite => aceite.y < altura);
        state.nitroItems = state.nitroItems.filter(item => item.y < altura);
        state.vidaItems = state.vidaItems.filter(item => item.y < altura);
        state.trampaClavosItems = state.trampaClavosItems.filter(item => item.y < altura);
        state.conos = state.conos.filter(cono => cono.y < altura);
        
        // Limitar partículas
        if (state.humoParticles.length > CONFIG.MAX_PARTICULAS) {
          state.humoParticles = state.humoParticles.slice(-CONFIG.MAX_PARTICULAS);
        }
        
        state.copos = state.copos.filter(c => c.y < altura);
        state.hojas = state.hojas.filter(h => h.y < altura);
        state.arena = state.arena.filter(a => a.y < altura);
        state.granizos = state.granizos.filter(g => g.y < altura);
      }

      function updateObjects() {
        // Mover objetos con la velocidad actual
        const speed = state.speed;
        
        state.objetivos.forEach(obj => obj.y += speed);
        state.obstacles.forEach(obs => obs.y += speed);
        state.powerups.forEach(pw => pw.y += speed);
        state.aceites.forEach(aceite => aceite.y += speed);
        state.nitroItems.forEach(item => item.y += speed);
        state.vidaItems.forEach(item => item.y += speed);
        state.conos.forEach(cono => cono.y += speed);
        
        state.trampaClavosItems.forEach(item => {
          item.y += speed;
          item.rotation += item.rotationSpeed;
          if (item.seMueve) {
            item.x += item.slideDirection * 0.5;
            if (item.x < CONFIG.LEFT_BORDER + CONFIG.BORDER_WIDTH || item.x + item.width > CONFIG.RIGHT_BORDER - CONFIG.BORDER_WIDTH) {
              item.slideDirection *= -1;
            }
          }
        });
      }

      // ==================== RENDERIZADO ====================
      function fondoPorNivel() {
        if (state.nocheActiva) return '#001122';
        if (state.level <= 2) return '#222';
        if (state.level <= 4) return '#001144';
        return '#552200';
      }

      function drawRoadLines(ctx) {
        ctx.strokeStyle = 'gold';
        ctx.lineWidth = CONFIG.BORDER_WIDTH;
        
        ctx.beginPath();
        ctx.moveTo(CONFIG.LEFT_BORDER, 0);
        ctx.lineTo(CONFIG.LEFT_BORDER, CONFIG.CANVAS_HEIGHT);
        ctx.stroke();
        
        ctx.beginPath();
        ctx.moveTo(CONFIG.RIGHT_BORDER, 0);
        ctx.lineTo(CONFIG.RIGHT_BORDER, CONFIG.CANVAS_HEIGHT);
        ctx.stroke();
        
        if (state.level >= 5) {
          ctx.strokeStyle = `hsl(${Date.now()/50 % 360}, 80%, 50%)`;
        } else {
          ctx.strokeStyle = 'white';
        }
        ctx.lineWidth = 3;
        
        state.lineOffset += state.speed;
        if (state.lineOffset > CONFIG.LINE_GAP + CONFIG.LINE_HEIGHT) {
          state.lineOffset = 0;
        }
        
        CONFIG.LINE_POSITIONS.forEach(posX => {
          for (let y = -CONFIG.LINE_HEIGHT; y < CONFIG.CANVAS_HEIGHT; y += CONFIG.LINE_GAP + CONFIG.LINE_HEIGHT) {
            const lineY = y + state.lineOffset;
            ctx.beginPath();
            ctx.moveTo(posX, lineY);
            ctx.lineTo(posX, lineY + CONFIG.LINE_HEIGHT);
            ctx.stroke();
          }
        });
      }

      function drawPatrulla(ctx) {
        const ahora = Date.now();
        
        // Humo de daño
        if (state.vidas === 1 && state.frameCount % 5 === 0 && state.humoParticles.length < CONFIG.MAX_PARTICULAS) {
          const centerX = state.patrulla.x + state.patrulla.width / 2;
          state.humoParticles.push({
            x: centerX + (Math.random() - 0.5) * 15,
            y: state.patrulla.y + state.patrulla.height - 10,
            size: 1 + Math.random() * 15, alpha: 0.7,
            speedX: (Math.random() - 0.5) * 1.5, speedY: -Math.random() * 1.5,
            decay: 0.01 + Math.random() * 0.02,
            color: 'rgba(200, 200, 200, 0.8)'
          });
        }
        
        // Deslizamiento
        if (state.deslizando) {
          if (ahora - state.tiempoDeslizamiento > CONFIG.TIEMPO_DESLIZAMIENTO_MAX) {
            state.deslizando = false;
          } else {
            state.patrulla.x += (Math.random() - 0.5) * 4;
            state.patrulla.x = Math.max(CONFIG.LEFT_BORDER + CONFIG.BORDER_WIDTH, 
                               Math.min(CONFIG.RIGHT_BORDER - CONFIG.BORDER_WIDTH - state.patrulla.width, state.patrulla.x));
            state.patrulla.targetX = state.patrulla.x;
            
            ctx.save();
            ctx.translate(state.patrulla.x + state.patrulla.width/2, state.patrulla.y + state.patrulla.height/2);
            ctx.rotate((Math.random() - 0.5) * 0.3);
            ctx.translate(-(state.patrulla.x + state.patrulla.width/2), -(state.patrulla.y + state.patrulla.height/2));
          }
        } else {
          state.patrulla.x += (state.patrulla.targetX - state.patrulla.x) * 0.2;
        }

        const invulnerable = ahora - state.tiempoUltimoChoque < CONFIG.TIEMPO_INVULNERABLE;

        if (invulnerable && Math.floor(ahora / 100) % 2 === 0) {
          if (state.deslizando) ctx.restore();
          return;
        }

        state.frameCount++;
        if (state.frameCount % 8 === 0) {
          state.currentPatrullaImgIndex = (state.currentPatrullaImgIndex + 1) % state.patrullaImgs.length;
        }

        const imgToDraw = state.patrullaImgs[state.currentPatrullaImgIndex];
        if (imgToDraw && imgToDraw.complete) {
          ctx.drawImage(imgToDraw, Math.round(state.patrulla.x), Math.round(state.patrulla.y), state.patrulla.width, state.patrulla.height);
        } else {
          ctx.fillStyle = '#0033aa';
          ctx.fillRect(state.patrulla.x, state.patrulla.y, state.patrulla.width, state.patrulla.height);
        }

        // Faros (noche)
        if (state.nocheActiva) {
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          
          // Faro izquierdo
          const leftLightX = state.patrulla.x + 5;
          const leftLightY = state.patrulla.y + state.patrulla.height - 60;
          
          const leftGradient = ctx.createRadialGradient(leftLightX, leftLightY, 10, leftLightX, leftLightY, 150);
          leftGradient.addColorStop(0, 'rgba(255, 255, 200, 0.8)');
          leftGradient.addColorStop(0.5, 'rgba(255, 255, 200, 0.3)');
          leftGradient.addColorStop(1, 'rgba(255, 255, 200, 0)');
          ctx.fillStyle = leftGradient;
          ctx.beginPath();
          ctx.moveTo(leftLightX, leftLightY);
          ctx.lineTo(leftLightX - 100, leftLightY - 200);
          ctx.lineTo(leftLightX + 100, leftLightY - 200);
          ctx.closePath();
          ctx.fill();
          
          // Faro derecho
          const rightLightX = state.patrulla.x + state.patrulla.width - 5;
          const rightLightY = state.patrulla.y + state.patrulla.height - 60;
          
          const rightGradient = ctx.createRadialGradient(rightLightX, rightLightY, 10, rightLightX, rightLightY, 150);
          rightGradient.addColorStop(0, 'rgba(255, 255, 200, 0.8)');
          rightGradient.addColorStop(0.5, 'rgba(255, 255, 200, 0.3)');
          rightGradient.addColorStop(1, 'rgba(255, 255, 200, 0)');
          ctx.fillStyle = rightGradient;
          ctx.beginPath();
          ctx.moveTo(rightLightX, rightLightY);
          ctx.lineTo(rightLightX - 100, rightLightY - 200);
          ctx.lineTo(rightLightX + 100, rightLightY - 200);
          ctx.closePath();
          ctx.fill();
          
          ctx.fillStyle = 'rgba(255, 255, 200, 0.9)';
          ctx.beginPath();
          ctx.arc(leftLightX, leftLightY, 8, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(rightLightX, rightLightY, 8, 0, Math.PI * 2);
          ctx.fill();
          
          ctx.restore();
        }

        // Escudos
        if (state.escudosRecolectados > 0) {
          const time = Date.now() / 100;
          const flashIntensity1 = 0.5 + 0.5 * Math.sin(time);
          const flashIntensity2 = 0.3 + 0.3 * Math.sin(time + 1);
          
          ctx.save();
          
          const shieldColor = state.escudosRecolectados >= 2 ? 'rgba(255, 215, 0, ' : 'rgba(0, 255, 255, ';
          
          ctx.strokeStyle = shieldColor + flashIntensity1 + ')';
          ctx.lineWidth = 3;
          ctx.shadowColor = state.escudosRecolectados >= 2 ? 'gold' : 'cyan';
          ctx.shadowBlur = 15 * flashIntensity1;
          
          ctx.beginPath();
          ctx.arc(state.patrulla.x + state.patrulla.width / 2, state.patrulla.y + state.patrulla.height / 2, 35, 0, Math.PI * 2);
          ctx.stroke();
          
          ctx.strokeStyle = state.escudosRecolectados >= 2 ? 'rgba(255, 235, 150, ' + flashIntensity2 + ')' : 'rgba(100, 255, 255, ' + flashIntensity2 + ')';
          ctx.lineWidth = 2;
          ctx.shadowBlur = 10 * flashIntensity2;
          ctx.beginPath();
          ctx.arc(state.patrulla.x + state.patrulla.width / 2, state.patrulla.y + state.patrulla.height / 2, 40, 0, Math.PI * 2);
          ctx.stroke();
          
          ctx.restore();
        }

        if (state.deslizando) ctx.restore();
      }

      function draw(ctx) {
        // Limpiar canvas
        ctx.clearRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);
        
        // Aplicar shake
        ctx.save();
        if (state.shakeFrames > 0) {
          const intensity = state.shakeFrames / 15;
          ctx.translate((Math.random() - 0.5) * 10 * intensity, (Math.random() - 0.5) * 10 * intensity);
          state.shakeFrames--;
        }
        
        // Fondo
        ctx.fillStyle = fondoPorNivel();
        ctx.fillRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);
        
        // Efectos climáticos (simplificados para rendimiento)
        if (state.nieblaActiva) {
          const gradient = ctx.createLinearGradient(0, 0, 0, CONFIG.CANVAS_HEIGHT);
          gradient.addColorStop(0, 'rgba(200, 200, 200, 0.1)');
          gradient.addColorStop(1, 'rgba(200, 200, 200, 0.5)');
          ctx.fillStyle = gradient;
          ctx.fillRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);
        }
        
        if (state.nocheActiva) {
          ctx.fillStyle = 'rgba(0, 0, 50, 0.5)';
          ctx.fillRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);
        }
        
        // Carretera
        drawRoadLines(ctx);
        
        // Objetos
        drawObjetos(ctx);
        
        // Efectos
        drawEfectos(ctx);
        
        // Patrulla (última para estar encima)
        drawPatrulla(ctx);
        
        ctx.restore();
        
        state.pulso += 0.05;
      }

      function drawObjetos(ctx) {
        // Aceite
        state.aceites.forEach(aceite => {
          ctx.beginPath();
          ctx.ellipse(aceite.x, aceite.y, aceite.size, aceite.size * 0.7, 0, 0, Math.PI * 2);
          
          const gradient = ctx.createRadialGradient(aceite.x, aceite.y, aceite.size * 0.3, aceite.x, aceite.y, aceite.size);
          gradient.addColorStop(0, 'rgba(50, 50, 50, 0.8)');
          gradient.addColorStop(0.5, 'rgba(20, 20, 20, 0.9)');
          gradient.addColorStop(1, 'rgba(0, 0, 0, 0.7)');
          
          ctx.fillStyle = gradient;
          ctx.fill();
          
          ctx.beginPath();
          ctx.ellipse(aceite.x - aceite.size * 0.3, aceite.y - aceite.size * 0.2, aceite.size * 0.15, aceite.size * 0.1, 0, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
          ctx.fill();
        });

        // Obstáculos
        state.obstacles.forEach(obs => {
          ctx.fillStyle = '#333';
          ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
        });

        // Objetivos (placas)
        const pulseSize = 0.9 + Math.abs(Math.sin(state.pulso * 2)) * 0.2;
        state.objetivos.forEach(obj => {
          if (images.placaPolicia.complete) {
            const size = 30 * pulseSize;
            ctx.drawImage(images.placaPolicia, obj.x + (30 - size)/2, obj.y + (30 - size)/2, size, size);
          } else {
            ctx.fillStyle = 'gold';
            ctx.beginPath();
            ctx.arc(obj.x + 15, obj.y + 15, 15 * pulseSize, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'black';
            ctx.font = 'bold 12px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('P', obj.x + 15, obj.y + 15);
          }
        });

        // Powerups
        const floatOffset = Math.sin(Date.now() * 0.005) * 3;
        state.powerups.forEach(pw => {
          if (images.powerup.complete) {
            const size = 30 * pulseSize;
            ctx.drawImage(images.powerup, pw.x + (30 - size)/2, pw.y + (30 - size)/2 + floatOffset, size, size);
          } else {
            ctx.fillStyle = 'cyan';
            ctx.beginPath();
            ctx.arc(pw.x + 15, pw.y + 15 + floatOffset, 15 * pulseSize, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'white';
            ctx.font = 'bold 12px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('S', pw.x + 15, pw.y + 15 + floatOffset);
          }
        });

        // Nitro items
        state.nitroItems.forEach(item => {
          const pulseIntensity = 0.5 + 0.5 * Math.sin(Date.now() * 0.005);
          ctx.save();
          ctx.shadowColor = `rgba(255, 165, 0, ${pulseIntensity * 0.7})`;
          ctx.shadowBlur = 10 * pulseIntensity;
          
          if (images.nitroItem.complete) {
            ctx.drawImage(images.nitroItem, item.x, item.y + floatOffset, 30, 30);
          } else {
            const gradient = ctx.createLinearGradient(item.x, item.y, item.x, item.y + 30);
            gradient.addColorStop(0, 'rgba(255, 200, 0, 0.8)');
            gradient.addColorStop(0.5, 'rgba(255, 100, 0, 0.8)');
            gradient.addColorStop(1, 'rgba(255, 100, 0, 0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(item.x, item.y + floatOffset, 30, 30);
            ctx.fillStyle = 'white';
            ctx.font = 'bold 10px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('NITRO', item.x + 15, item.y + 15 + floatOffset);
          }
          ctx.restore();
        });

        // Vida items
        state.vidaItems.forEach(item => {
          ctx.save();
          const glowIntensity = 0.5 + 0.5 * Math.sin(Date.now() / 200);
          ctx.shadowColor = 'rgba(0, 255, 255, ' + glowIntensity + ')';
          ctx.shadowBlur = 15 * glowIntensity;
          
          const size = 30 * pulseSize;
          if (images.vidaItem.complete) {
            ctx.drawImage(images.vidaItem, item.x + (30 - size)/2, item.y + (30 - size)/2 + floatOffset, size, size);
          } else {
            ctx.fillStyle = '#00CED1';
            ctx.beginPath();
            ctx.arc(item.x + 15, item.y + 15 + floatOffset, size/2, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'white';
            ctx.font = 'bold 16px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('+', item.x + 15, item.y + 15 + floatOffset);
          }
          ctx.restore();
        });

        // Trampas de clavos
        state.trampaClavosItems.forEach(item => {
          ctx.save();
          ctx.translate(item.x + item.width / 2, item.y + item.height / 2);
          ctx.rotate(item.rotation);
          ctx.translate(-(item.x + item.width / 2), -(item.y + item.height / 2));
          
          if (images.trampaClavos.complete) {
            ctx.drawImage(images.trampaClavos, item.x, item.y, item.width, item.height);
          } else {
            ctx.fillStyle = '#8B4513';
            ctx.beginPath();
            ctx.arc(item.x + 15, item.y + 15, 15, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'black';
            for (let i = 0; i < 8; i++) {
              const angle = (Math.PI * 2 / 8) * i;
              const nailX = item.x + 15 + Math.cos(angle) * 10;
              const nailY = item.y + 15 + Math.sin(angle) * 10;
              ctx.beginPath();
              ctx.moveTo(nailX, nailY);
              ctx.lineTo(item.x + 15 + Math.cos(angle) * 5, item.y + 15 + Math.sin(angle) * 5);
              ctx.lineWidth = 2;
              ctx.strokeStyle = 'silver';
              ctx.stroke();
            }
          }
          ctx.restore();
        });

        // Conos
        state.conos.forEach(cono => {
          if (images.cono.complete) {
            ctx.drawImage(images.cono, cono.x, cono.y, cono.width, cono.height);
          } else {
            ctx.fillStyle = 'orange';
            ctx.beginPath();
            ctx.moveTo(cono.x + cono.width/2, cono.y);
            ctx.lineTo(cono.x + cono.width, cono.y + cono.height);
            ctx.lineTo(cono.x, cono.y + cono.height);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(cono.x + cono.width/3, cono.y + cono.height/3);
            ctx.lineTo(cono.x + cono.width/2, cono.y + cono.height/2);
            ctx.stroke();
          }
        });
      }

      function drawEfectos(ctx) {
        // Humo
        state.humoParticles.forEach((p, i) => {
          ctx.fillStyle = p.color || `rgba(50, 50, 50, ${p.alpha})`;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
          
          p.x += p.speedX;
          p.y += p.speedY;
          p.alpha -= p.decay;
          p.size *= 0.99;
          
          if (p.alpha <= 0) {
            state.humoParticles.splice(i, 1);
          }
        });

        // Marcas de derrape
        state.derrapeMarks.forEach((mark, i) => {
          ctx.strokeStyle = `rgba(150, 150, 150, ${mark.alpha})`;
          ctx.lineWidth = mark.width;
          ctx.beginPath();
          ctx.moveTo(mark.x1, mark.y1);
          ctx.lineTo(mark.x2, mark.y2);
          ctx.stroke();
          
          mark.alpha -= 0.01;
          if (mark.alpha <= 0) {
            state.derrapeMarks.splice(i, 1);
          }
        });

        // Lluvia
        if (state.level >= 6 || state.climaActual === 'tormenta' || (state.climaActual === 'granizo' && state.climaSecundario === 'lluvia')) {
          if (Math.random() < 0.3 && state.gotas.length < 200) {
            state.gotas.push({ x: Math.random() * CONFIG.CANVAS_WIDTH, y: -10, speed: 2 + Math.random() * 5, length: 10 + Math.random() * 10 });
          }
          
          ctx.strokeStyle = 'rgba(200, 200, 255, 0.7)';
          ctx.lineWidth = 1;
          for (let i = state.gotas.length - 1; i >= 0; i--) {
            const g = state.gotas[i];
            ctx.beginPath();
            ctx.moveTo(g.x, g.y);
            ctx.lineTo(g.x - g.length * 0.3, g.y + g.length);
            ctx.stroke();
            g.y += g.speed;
            if (g.y > CONFIG.CANVAS_HEIGHT) state.gotas.splice(i, 1);
          }
        }

        // Nieve
        ctx.fillStyle = 'white';
        state.copos.forEach((copo, i) => {
          ctx.beginPath();
          ctx.arc(copo.x, copo.y, copo.size, 0, Math.PI * 2);
          ctx.fill();
          copo.y += copo.speed;
          copo.x += Math.sin(copo.y * 0.1) * 1.5;
        });

        // Granizo
        ctx.fillStyle = 'rgba(0, 0, 255, 0.8)';
        state.granizos.forEach((g, i) => {
          ctx.beginPath();
          ctx.arc(g.x, g.y, g.size, 0, Math.PI * 2);
          ctx.fill();
          g.y += g.speed;
        });

        // Rayos
        const ahora = Date.now();
        if (state.climaActual === 'tormenta' && ahora - state.ultimoTrueno > 5000 + Math.random() * 3000) {
          state.ultimoTrueno = ahora;
          
          // Flash de pantalla (usando overlay en lugar de modificar estilo)
          ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
          ctx.fillRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);
          
          if (state.sonidoActivado) playSound(sounds.trueno);
          
          const x = CONFIG.LEFT_BORDER + CONFIG.BORDER_WIDTH + Math.random() * (CONFIG.RIGHT_BORDER - CONFIG.LEFT_BORDER - 2 * CONFIG.BORDER_WIDTH);
          state.rayos.push({
            x, y: 0, estado: 'advertencia', tiempoInicio: ahora,
            tiempoAdvertencia: 1500, tiempoImpacto: 150,
            ancho: 20 + Math.random() * 30, ramificaciones: Math.floor(Math.random() * 3) + 1
          });
        }

        state.rayos.forEach((rayo, idx) => {
          if (rayo.estado === 'advertencia') {
            if (ahora - rayo.tiempoInicio > rayo.tiempoAdvertencia) {
              rayo.estado = 'impacto';
              rayo.tiempoInicio = ahora;
              
              for (let i = 0; i < 30 && state.particulasRayos.length < CONFIG.MAX_PARTICULAS; i++) {
                state.particulasRayos.push({
                  x: rayo.x + (Math.random() - 0.5) * rayo.ancho,
                  y: Math.random() * CONFIG.CANVAS_HEIGHT,
                  size: 2 + Math.random() * 5, alpha: 0.8,
                  speedX: (Math.random() - 0.5) * 5, speedY: -Math.random() * 10,
                  decay: 0.02 + Math.random() * 0.03,
                  color: `rgba(255, ${200 + Math.random() * 55}, 0, 1)`
                });
              }
              
              // Colisión con jugador
              if (state.patrulla.x < rayo.x + rayo.ancho/2 && state.patrulla.x + state.patrulla.width > rayo.x - rayo.ancho/2) {
                if (state.escudosRecolectados >= 2) {
                  state.escudosRecolectados = 1;
                  playSound(sounds.antiPowerup);
                } else if (state.escudosRecolectados === 1) {
                  state.escudosRecolectados = 0;
                  state.vidas--;
                  playSound(sounds.choque);
                } else {
                  state.vidas = Math.max(0, state.vidas - 2);
                  playSound(sounds.choque);
                }
                
                state.shakeFrames = 15;
                state.tiempoUltimoChoque = ahora;
                
                if (state.vidas <= 0) gameOverHandler();
                updateHUD();
              }
              
              state.crateres.push({
                x: rayo.x - 20, y: CONFIG.CANVAS_HEIGHT - 40,
                width: 40, height: 30, tiempoCreacion: ahora, particulas: []
              });
              
              if (state.sonidoActivado) playSound(sounds.impactoRayo);
            } else {
              const tiempoTranscurrido = ahora - rayo.tiempoInicio;
              const parpadeo = Math.floor(tiempoTranscurrido / 200) % 2 === 0;
              
              if (parpadeo) {
                ctx.fillStyle = `rgba(255, 0, 0, ${0.3 + 0.3 * Math.sin(tiempoTranscurrido / 100)})`;
                ctx.beginPath();
                ctx.arc(rayo.x, CONFIG.CANVAS_HEIGHT - 20, rayo.ancho/2, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = 'white';
                ctx.font = 'bold 16px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('¡RAYO INMINENTE!', rayo.x, CONFIG.CANVAS_HEIGHT - 40);
              }
            }
          } else if (rayo.estado === 'impacto') {
            ctx.save();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.lineWidth = 3;
            ctx.shadowColor = 'cyan';
            ctx.shadowBlur = 15;
            
            ctx.beginPath();
            ctx.moveTo(rayo.x, 0);
            ctx.lineTo(rayo.x, CONFIG.CANVAS_HEIGHT);
            ctx.stroke();
            
            for (let i = 0; i < rayo.ramificaciones; i++) {
              const offsetX = (Math.random() - 0.5) * rayo.ancho;
              const startY = Math.random() * CONFIG.CANVAS_HEIGHT * 0.7;
              const endY = startY + Math.random() * CONFIG.CANVAS_HEIGHT * 0.3;
              
              ctx.beginPath();
              ctx.moveTo(rayo.x, startY);
              ctx.lineTo(rayo.x + offsetX, endY);
              ctx.stroke();
            }
            ctx.restore();
            
            if (ahora - rayo.tiempoInicio > rayo.tiempoImpacto) {
              state.rayos.splice(idx, 1);
            }
          }
        });

        // Partículas de rayos
        state.particulasRayos.forEach((p, idx) => {
          ctx.fillStyle = p.color.replace('1)', p.alpha + ')');
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
          
          p.x += p.speedX;
          p.y += p.speedY;
          p.alpha -= p.decay;
          p.size *= 0.98;
          
          if (p.alpha <= 0) state.particulasRayos.splice(idx, 1);
        });

        // Cráteres
        state.crateres.forEach((crater, idx) => {
          if (ahora - crater.tiempoCreacion > 3000) {
            state.crateres.splice(idx, 1);
            return;
          }
          
          if (images.crater.complete) {
            ctx.drawImage(images.crater, crater.x, crater.y, crater.width, crater.height);
          } else {
            ctx.fillStyle = '#111';
            ctx.beginPath();
            ctx.ellipse(crater.x + crater.width/2, crater.y + crater.height/2, crater.width/2, crater.height/2, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.ellipse(crater.x + crater.width/2, crater.y + crater.height/2, crater.width/3, crater.height/3, 0, 0, Math.PI * 2);
            ctx.fill();
          }
          
          if (state.frameCount % 5 === 0 && state.particulasCrateres.length < CONFIG.MAX_PARTICULAS) {
            state.particulasCrateres.push({
              x: crater.x + crater.width/2 + (Math.random() - 0.5) * 10,
              y: crater.y + (Math.random() * 5),
              size: 5 + Math.random() * 10, alpha: 0.6,
              speedX: (Math.random() - 0.5) * 0.5, speedY: -Math.random() * 1.5,
              decay: 0.01 + Math.random() * 0.02,
              color: 'rgba(100, 100, 100, 0.7)'
            });
          }
        });

        state.particulasCrateres.forEach((p, idx) => {
          ctx.fillStyle = p.color.replace('0.7)', p.alpha + ')');
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
          
          p.x += p.speedX;
          p.y += p.speedY;
          p.alpha -= p.decay;
          p.size *= 0.99;
          
          if (p.alpha <= 0) state.particulasCrateres.splice(idx, 1);
        });
      }

      // ==================== GUARDADO / CARGA ====================
      function sanitizeKey(name) {
        return 'autosave_' + name.replace(/[^a-zA-Z0-9]/g, '');
      }

      function cargarProgreso() {
        const key = sanitizeKey(state.nombreJugador);
        const datos = JSON.parse(localStorage.getItem(key) || '{}');
        if (datos.score) {
          state.score = datos.score;
          state.level = datos.level;
          state.highScore = datos.highScore || 0;
          state.maxCombo = datos.maxCombo || 0;
        }
      }

      function guardarProgreso() {
        const ahora = Date.now();
        if (ahora - state.tiempoUltimoGuardado > 10000) {
          const key = sanitizeKey(state.nombreJugador);
          localStorage.setItem(key, JSON.stringify({
            score: state.score,
            level: state.level,
            highScore: state.highScore,
            maxCombo: state.maxCombo
          }));
          state.tiempoUltimoGuardado = ahora;
        }
      }

      // ==================== INICIO / RESET ====================
      async function iniciarJuego() {
        const nombreInput = document.getElementById('nombreJugador');
        state.nombreJugador = sanitizeName(nombreInput.value.trim() || 'Jugador');
        
        const colorPatrulla = document.getElementById('colorPatrulla').value;
        state.patrullaImgs = patrullaAssets[colorPatrulla].map(src => {
          const img = new Image();
          img.src = src;
          return img;
        });
        
        state.highScore = parseInt(localStorage.getItem('highScore_' + state.nombreJugador) || '0');
        cargarProgreso();
        
        document.getElementById('inicio').style.display = 'none';
        stopSound(sounds.musicaInicio);
        if (state.sonidoActivado) playSound(sounds.musicaFondo);
        
        resetGame();
      }

      function resetGame() {
        state.patrulla.x = CONFIG.CANVAS_WIDTH / 2 - 20;
        state.patrulla.y = CONFIG.CANVAS_HEIGHT - 100;
        state.patrulla.targetX = CONFIG.CANVAS_WIDTH / 2 - 20;
        
        state.obstacles = [];
        state.objetivos = [];
        state.powerups = [];
        state.aceites = [];
        state.nitroItems = [];
        state.vidaItems = [];
        state.trampaClavosItems = [];
        state.conos = [];
        state.humoParticles = [];
        state.derrapeMarks = [];
        state.gotas = [];
        state.hojas = [];
        state.copos = [];
        state.arena = [];
        state.granizos = [];
        state.rayos = [];
        state.crateres = [];
        state.particulasRayos = [];
        state.particulasCrateres = [];
        
        state.score = 0;
        state.level = 1;
        state.speed = CONFIG.INITIAL_SPEED;
        state.vidas = 3;
        state.escudosRecolectados = 0;
        state.shakeFrames = 0;
        state.gameOver = false;
        state.tiempoUltimoChoque = 0;
        state.deslizando = false;
        state.lineOffset = 0;
        state.combo = 0;
        state.nitro = 100;
        state.placasRecolectadasDesdeUltimaVida = 0;
        state.placasParaVida = CONFIG.PLACAS_PARA_VIDA_BASE;
        state.tiempoUltimoNitroItem = 0;
        state.nitroItemIntervalo = CONFIG.NITRO_ITEM_INTERVALO_BASE;
        state.juegoPausado = false;
        state.climaActual = 'normal';
        state.tiempoCambioClima = 0;
        state.tiempoDuracionClima = 0;
        state.nieblaActiva = false;
        state.nocheActiva = false;
        state.vientoActivo = false;
        state.tiempoUltimaPlaca = 0;
        
        stopAllAmbientSounds();
        desactivarNitro();
        
        document.getElementById('gameOverScreen').style.display = 'none';
        updateHUD();
      }

      // ==================== EVENT LISTENERS ====================
      document.getElementById('btnActivarSonido').addEventListener('click', function() {
        state.sonidoActivado = !state.sonidoActivado;
        if (state.sonidoActivado) {
          this.textContent = '🔊 Sonido Activado';
          this.style.background = '#28a745';
          if (document.getElementById('inicio').style.display === 'flex') {
            playSound(sounds.musicaInicio);
          }
        } else {
          stopAllAmbientSounds();
          stopSound(sounds.musicaFondo);
          stopSound(sounds.musicaInicio);
          this.textContent = '🔇 Sonido Desactivado';
          this.style.background = '#dc3545';
        }
      });

      document.getElementById('btnReiniciar').addEventListener('click', async () => {
        stopSound(sounds.musicaFondo);
        stopAllAmbientSounds();
        desactivarNitro();
        
        if (state.sonidoActivado) playSound(sounds.musicaInicio);
        
        document.getElementById('inicio').style.display = 'flex';
        document.getElementById('gameOverScreen').style.display = 'none';
      });

      if (!isMobile) {
        document.addEventListener('keydown', (e) => {
          if (!state.deslizando && !state.juegoPausado && !state.gameOver) {
            if (e.key === 'ArrowLeft') {
              state.patrulla.targetX = Math.max(CONFIG.LEFT_BORDER + CONFIG.BORDER_WIDTH, state.patrulla.targetX - 40);
            }
            if (e.key === 'ArrowRight') {
              state.patrulla.targetX = Math.min(CONFIG.RIGHT_BORDER - CONFIG.BORDER_WIDTH - state.patrulla.width, state.patrulla.targetX + 40);
            }
            if (e.key === ' ' || e.key === 'Spacebar') {
              e.preventDefault();
              activarNitro();
            }
          }
        });

        document.addEventListener('keyup', (e) => {
          if (e.key === ' ' || e.key === 'Spacebar') {
            desactivarNitro();
          }
        });
      }

      // Selección de vehículo
      document.querySelectorAll('.vehicle-option').forEach(option => {
        option.addEventListener('click', function() {
          document.querySelectorAll('.vehicle-option').forEach(opt => opt.classList.remove('selected'));
          this.classList.add('selected');
          document.getElementById('colorPatrulla').value = this.getAttribute('data-value');
        });
      });

      // ==================== RESIZE ====================
      function resizeCanvas() {
        const container = isMobile ? document.getElementById('game-container') : document.querySelector('.arcade-screen');
        const canvas = gameCanvas;
        
        if (isMobile) {
          const containerHeight = container.clientHeight;
          const containerWidth = container.clientWidth;
          const targetRatio = CONFIG.CANVAS_HEIGHT / CONFIG.CANVAS_WIDTH;
          const currentRatio = containerHeight / containerWidth;
          
          if (currentRatio > targetRatio) {
            canvas.style.width = '100%';
            canvas.style.height = (containerWidth * targetRatio) + 'px';
          } else {
            canvas.style.height = '100%';
            canvas.style.width = (containerHeight / targetRatio) + 'px';
          }
        } else {
          const containerWidth = container.clientWidth;
          const containerHeight = container.clientHeight;
          const ratio = CONFIG.CANVAS_HEIGHT / CONFIG.CANVAS_WIDTH;
          
          if (containerHeight / containerWidth > ratio) {
            canvas.style.width = containerWidth + 'px';
            canvas.style.height = containerWidth * ratio + 'px';
          } else {
            canvas.style.height = containerHeight + 'px';
            canvas.style.width = containerHeight / ratio + 'px';
          }
        }
        
        canvas.width = CONFIG.CANVAS_WIDTH;
        canvas.height = CONFIG.CANVAS_HEIGHT;
      }

      // ==================== GAME LOOP ====================
      function gameLoop() {
        if (!state.gameOver) {
          // Spawn objetos
          spawnObstacle();
          spawnObjetivo();
          spawnPowerup();
          spawnAceite();
          spawnNitroItem();
          spawnTrampaClavos();
          spawnCono();
          
          // Clima
          cambiarClima();
          spawnNieve();
          spawnGranizo();
          
          // Actualizaciones
          updateObjects();
          checkCollisions();
          checkLevelUp();
          cleanUpObjects();
          
          // Nitro regeneración
          if (!state.nitroActivo && state.nitro < 100) {
            state.nitro = Math.min(100, state.nitro + CONFIG.NITRO_REGEN);
            updateHUD();
          }
          
          // Score high
          if (state.score > state.highScore) {
            state.highScore = state.score;
            localStorage.setItem('highScore_' + state.nombreJugador, state.highScore);
            updateHUD();
          }
          
          // Guardado
          guardarProgreso();
          
          // Dibujar
          const ctx = gameCanvas.getContext('2d');
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          const scaleX = parseFloat(gameCanvas.style.width) / CONFIG.CANVAS_WIDTH;
          const scaleY = parseFloat(gameCanvas.style.height) / CONFIG.CANVAS_HEIGHT;
          ctx.scale(scaleX, scaleY);
          
          draw(ctx);
        }
        
        requestAnimationFrame(gameLoop);
      }

      // ==================== INICIALIZACIÓN ====================
      window.addEventListener('load', () => {
        // Mostrar pantalla de carga por 3 segundos
        setTimeout(() => {
          document.getElementById('loading-screen').style.display = 'none';
          document.getElementById('inicio').style.display = 'flex';
          
          // Seleccionar primer vehículo por defecto
          const firstOption = document.querySelector('.vehicle-option');
          if (firstOption) firstOption.classList.add('selected');
        }, 3000);
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        setupControls();
        gameLoop();
      });

    })();
  </script>
</body>
</html>
