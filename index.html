        GameState.escudosRecolectados = 0;
        GameState.shakeFrames = 0;
        GameState.gameOver = false;
        GameState.tiempoUltimoChoque = 0;
        GameState.deslizando = false;
        GameState.tiempoDeslizamiento = 0;
        GameState.combo = 0;
        GameState.nitro = 100;
        GameState.placasRecolectadasDesdeUltimaVida = 0;
        GameState.ultimoNitroItemTiempo = 0;
        GameState.nitroItemInterval = CONSTANTS.NITRO_ITEM_BASE_INTERVAL;
        GameState.placasParaVida = CONSTANTS.PLACAS_BASE_FOR_VIDA;
        GameState.tiempoUltimoLevelUp = 0;
        GameState.juegoPausado = false;
        
        GameState.climaActual = 'normal';
        GameState.climaSecundario = null;
        GameState.tiempoCambioClima = 0;
        GameState.tiempoDuracionClima = 0;
        GameState.nieblaActiva = false;
        GameState.nocheActiva = false;
        GameState.vientoActivo = false;
        GameState.ultimoTrueno = 0;
        GameState.tiempoUltimaPlaca = 0;
        
        if (GameState.comboTimeout) {
          clearTimeout(GameState.comboTimeout);
          GameState.comboTimeout = null;
        }
        
        sonidoViento.pause();
        sonidoNieve.pause();
        sonidoNoche.pause();
        
        document.getElementById('gameOverScreen').style.display = 'none';
        updateHUD();
      }

      async function iniciarJuego() {
        const nombreInput = document.getElementById('nombreJugador').value.trim() || 'Jugador';
        GameState.nombreJugador = sanitizarNombre(nombreInput);
        
        const colorPatrulla = document.getElementById('colorPatrulla').value;
        patrullaImgs = patrullaAssets[colorPatrulla].map(src => {
          const img = new Image();
          img.src = src;
          return img;
        });
        
        try {
          GameState.highScore = parseInt(localStorage.getItem('highScore_' + GameState.nombreJugador)) || 0;
          GameState.totalPuntos = parseInt(localStorage.getItem('puntos_' + GameState.nombreJugador)) || 0;
        } catch (e) {}
        
        cargarProgreso();
        
        document.getElementById('puntosTotales').textContent = 'Tus puntos: ' + GameState.totalPuntos;
        document.getElementById('inicio').style.display = 'none';
        
        sonidoInicio.pause();
        sonidoInicio.currentTime = 0;
        
        if (sonidoActivado) {
          musicaFondo.currentTime = 0;
          musicaFondo.play().catch(() => {});
        }
        
        resetGame();
      }

      // ==================== CONTROLADORES DE EVENTOS ====================
      function setupControls() {
        if (isMobile) {
          const leftControl = document.getElementById('left-control');
          const rightControl = document.getElementById('right-control');
          const btnNitro = document.getElementById('btnNitro');
          const btnLeft = document.getElementById('btnLeft');
          const btnRight = document.getElementById('btnRight');
          
          let moveInterval = null;
          let leftControlActive = false;
          let rightControlActive = false;
          
          function handleContinuousMove() {
            if (leftControlActive && !GameState.gameOver && !GameState.juegoPausado) {
              GameState.patrulla.targetX = Math.max(CONSTANTS.LEFT_BORDER + CONSTANTS.BORDER_WIDTH, 
                GameState.patrulla.targetX - 5);
            }
            if (rightControlActive && !GameState.gameOver && !GameState.juegoPausado) {
              GameState.patrulla.targetX = Math.min(CONSTANTS.RIGHT_BORDER - CONSTANTS.BORDER_WIDTH - GameState.patrulla.width, 
                GameState.patrulla.targetX + 5);
            }
          }
          
          leftControl.addEventListener('touchstart', (e) => {
            e.preventDefault();
            leftControlActive = true;
            if (!moveInterval) {
              moveInterval = setInterval(handleContinuousMove, 16);
            }
          }, { passive: false });
          
          leftControl.addEventListener('touchend', (e) => {
            e.preventDefault();
            leftControlActive = false;
            if (!rightControlActive && moveInterval) {
              clearInterval(moveInterval);
              moveInterval = null;
            }
          }, { passive: false });
          
          rightControl.addEventListener('touchstart', (e) => {
            e.preventDefault();
            rightControlActive = true;
            if (!moveInterval) {
              moveInterval = setInterval(handleContinuousMove, 16);
            }
          }, { passive: false });
          
          rightControl.addEventListener('touchend', (e) => {
            e.preventDefault();
            rightControlActive = false;
            if (!leftControlActive && moveInterval) {
              clearInterval(moveInterval);
              moveInterval = null;
            }
          }, { passive: false });
          
          btnNitro.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (!GameState.gameOver && !GameState.juegoPausado) {
              activarNitro();
            }
          }, { passive: false });
          
          btnNitro.addEventListener('touchend', (e) => {
            e.preventDefault();
            desactivarNitro();
          }, { passive: false });
          
          btnNitro.addEventListener('mouseup', (e) => {
            e.preventDefault();
            desactivarNitro();
          });
          
          btnNitro.addEventListener('mouseleave', (e) => {
            e.preventDefault();
            desactivarNitro();
          });
          
          btnLeft.addEventListener('touchstart', (e) => {
            e.preventDefault();
            leftControlActive = true;
            if (!moveInterval) {
              moveInterval = setInterval(handleContinuousMove, 16);
            }
          }, { passive: false });
          
          btnLeft.addEventListener('touchend', (e) => {
            e.preventDefault();
            leftControlActive = false;
            if (!rightControlActive && moveInterval) {
              clearInterval(moveInterval);
              moveInterval = null;
            }
          }, { passive: false });
          
          btnRight.addEventListener('touchstart', (e) => {
            e.preventDefault();
            rightControlActive = true;
            if (!moveInterval) {
              moveInterval = setInterval(handleContinuousMove, 16);
            }
          }, { passive: false });
          
          btnRight.addEventListener('touchend', (e) => {
            e.preventDefault();
            rightControlActive = false;
            if (!leftControlActive && moveInterval) {
              clearInterval(moveInterval);
              moveInterval = null;
            }
          }, { passive: false });
        } else {
          document.addEventListener('keydown', (e) => {
            if (!GameState.deslizando && !GameState.juegoPausado && !GameState.gameOver) {
              if (e.key === 'ArrowLeft') {
                GameState.patrulla.targetX = Math.max(CONSTANTS.LEFT_BORDER + CONSTANTS.BORDER_WIDTH, 
                  GameState.patrulla.targetX - 40);
              }
              if (e.key === 'ArrowRight') {
                GameState.patrulla.targetX = Math.min(CONSTANTS.RIGHT_BORDER - CONSTANTS.BORDER_WIDTH - GameState.patrulla.width, 
                  GameState.patrulla.targetX + 40);
              }
              if (e.key === ' ' || e.key === 'Spacebar') {
                activarNitro();
              }
            }
          });

          document.addEventListener('keyup', (e) => {
            if (e.key === ' ' || e.key === 'Spacebar') {
              desactivarNitro();
            }
          });
        }
      }

      // ==================== BUCLE PRINCIPAL ====================
      function gameLoop() {
        if (GameState.gameOver) {
          requestAnimationFrame(gameLoop);
          return;
        }
        
        spawnObstacle();
        spawnObjetivo();
        spawnPowerup();
        spawnAceite();
        spawnNitroItem();
        spawnTrampaClavos();
        spawnCono();
        
        cambiarClima();
        spawnClimaticParticles();
        
        checkCollisions();
        checkLevelUp();
        cleanUpObjects();
        
        if (!GameState.nitroActivo && GameState.nitro < 100) {
          GameState.nitro = Math.min(100, GameState.nitro + CONSTANTS.NITRO_REGEN_SPEED);
          updateHUD();
        }
        
        drawTormenta();
        aplicarEfectosClimaticos();
        
        draw();
        
        guardarProgreso();
        
        if (GameState.score > GameState.highScore) {
          GameState.highScore = GameState.score;
          try {
            localStorage.setItem('highScore_' + GameState.nombreJugador, GameState.highScore);
          } catch (e) {}
          updateHUD();
        }
        
        requestAnimationFrame(gameLoop);
      }

      // ==================== INICIALIZACIÓN ====================
      document.addEventListener('DOMContentLoaded', () => {
        function resizeCanvas() {
          const container = isMobile ? 
            document.getElementById('game-container-mobile') : 
            document.querySelector('.arcade-screen');
          
          if (!container) return;
          
          if (isMobile) {
            const containerHeight = container.clientHeight;
            const containerWidth = container.clientWidth;
            const targetRatio = CONSTANTS.CANVAS_HEIGHT / CONSTANTS.CANVAS_WIDTH;
            const currentRatio = containerHeight / containerWidth;
            
            if (currentRatio > targetRatio) {
              gameCanvas.style.width = '100%';
              gameCanvas.style.height = (containerWidth * targetRatio) + 'px';
            } else {
              gameCanvas.style.height = '100%';
              gameCanvas.style.width = (containerHeight / targetRatio) + 'px';
            }
          } else {
            const containerWidth = container.clientWidth;
            const containerHeight = container.clientHeight;
            const ratio = CONSTANTS.CANVAS_HEIGHT / CONSTANTS.CANVAS_WIDTH;
            let newWidth, newHeight;
            
            if (containerHeight / containerWidth > ratio) {
              newWidth = containerWidth;
              newHeight = containerWidth * ratio;
            } else {
              newHeight = containerHeight;
              newWidth = containerHeight / ratio;
            }
            
            gameCanvas.style.width = newWidth + 'px';
            gameCanvas.style.height = newHeight + 'px';
          }
          
          gameCanvas.width = CONSTANTS.CANVAS_WIDTH;
          gameCanvas.height = CONSTANTS.CANVAS_HEIGHT;
        }

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        const vehicleOptions = document.querySelectorAll('.vehicle-option');
        vehicleOptions.forEach(option => {
          option.addEventListener('click', function() {
            vehicleOptions.forEach(opt => opt.classList.remove('selected'));
            this.classList.add('selected');
            document.getElementById('colorPatrulla').value = this.getAttribute('data-value');
          });
        });
        
        document.getElementById('btnActivarSonido').addEventListener('click', async function() {
          if (sonidoActivado) {
            pausarTodosLosSonidos();
            sonidoActivado = false;
            this.textContent = '🔇 Sonido Desactivado';
            this.style.background = '#dc3545';
          } else {
            try {
              sonidoInicio.currentTime = 0;
              await sonidoInicio.play();
              sonidoActivado = true;
              this.textContent = '🔊 Sonido Activado';
              this.style.background = '#28a745';
            } catch (e) {
              console.warn('Error al activar sonido');
              this.textContent = '❌ Error al activar sonido';
              this.style.background = '#dc3545';
            }
          }
        });
        
        document.getElementById('btnReiniciar').addEventListener('click', async () => {
          musicaFondo.pause();
          musicaFondo.currentTime = 0;
          sonidoViento.pause();
          sonidoNieve.pause();
          sonidoNoche.pause();
          await desactivarNitro();
          pausarTodosLosSonidos();
          
          if (sonidoActivado) {
            sonidoInicio.currentTime = 0;
            sonidoInicio.play().catch(() => {});
          }
          
          document.getElementById('inicio').style.display = 'flex';
          document.getElementById('gameOverScreen').style.display = 'none';
        });
        
        window.iniciarJuego = iniciarJuego;
        
        // Simular carga de imágenes
        const totalImages = 12;
        let loadedImages = 0;
        
        function imageLoaded() {
          loadedImages++;
          const percent = Math.round((loadedImages / totalImages) * 100);
          document.getElementById('loading-progress-bar').style.width = percent + '%';
          document.getElementById('loading-text').textContent = `Cargando... ${percent}%`;
          
          if (loadedImages >= totalImages) {
            setTimeout(() => {
              document.getElementById('loading-screen').style.display = 'none';
              document.getElementById('inicio').style.display = 'flex';
              
              if (sonidoActivado) {
                sonidoInicio.currentTime = 0;
                sonidoInicio.play().catch(() => {});
              }
            }, 1000);
          }
        }
        
        const imagesToLoad = [
          'imagenes/cargaInicioPC_1.png',
          'imagenes/cargaInicioMovil_1.png',
          'imagenes/patrulla_1.png',
          'imagenes/patrulla_1b.png',
          'imagenes/transito_1.png',
          'imagenes/transito_1b.png',
          'imagenes/pbi_1.png',
          'imagenes/pbi_1b.png',
          'imagenes/auxiliar_1.png',
          'imagenes/auxiliar_1b.png',
          'imagenes/fondoComputadora_1.png',
          'imagenes/fondo_movil_1.png'
        ];
        
        imagesToLoad.forEach(src => {
          const img = new Image();
          img.onload = imageLoaded;
          img.onerror = imageLoaded;
          img.src = src;
        });
        
        setupControls();
        gameLoop();
      });
    })();
  </script>
</body>
</html>
