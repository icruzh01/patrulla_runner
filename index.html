<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Patrulla Runner Arcade</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      background: #000; 
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: 'Arial', sans-serif;
    }

    @media (min-width: 769px) {
      body { font-family: 'Press Start 2P', cursive; }
    }

    /* Estilos de la máquina arcade */
    .arcade-machine {
      position: relative;
      width: 800px;
      height: 900px;
      background: #c00;
      border-radius: 20px;
      border: 15px solid #333;
      box-shadow: 0 0 0 10px #555, 0 30px 50px rgba(0,0,0,0.7), inset 0 0 50px rgba(0,0,0,0.5);
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .arcade-screen-container {
      display: flex;
      width: 100%;
      height: 600px;
      position: relative;
    }

    .arcade-screen {
      width: 57%;
      height: 100%;
      background: #000;
      border: 10px solid #333;
      box-shadow: inset 0 0 20px rgba(0,255,255,0.3);
      position: relative;
      overflow: hidden;
    }

    .arcade-info-panel {
      width: 43%;
      height: 100%;
      background: #000;
      border: 10px solid #333;
      border-left: none;
      box-shadow: inset 0 0 20px rgba(0,255,255,0.1);
      padding: 15px;
      color: white;
      display: flex;
      flex-direction: column;
      font-size: 12px;
      overflow: hidden;
    }

    .arcade-bezel {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%"><rect width="100%" height="100%" fill="none" stroke="rgba(0,255,255,0.2)" stroke-width="10"/></svg>');
      pointer-events: none;
      z-index: 10;
    }

    .arcade-title {
      color: #ff0;
      text-shadow: 3px 3px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
      margin: 15px 0;
      font-size: 24px;
      text-align: center;
    }

    .arcade-controls {
      display: flex;
      justify-content: space-between;
      width: 100%;
      margin-top: 30px;
    }

    .arcade-button {
      width: 60px;
      height: 60px;
      background: #333;
      border-radius: 50%;
      border: 5px solid #111;
      box-shadow: inset 0 -5px 10px rgba(0,0,0,0.5), 0 5px 5px rgba(0,0,0,0.3);
      position: relative;
    }

    .arcade-button:after {
      content: '';
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      bottom: 10px;
      background: #c00;
      border-radius: 50%;
      box-shadow: inset 0 3px 5px rgba(0,0,0,0.5);
    }

    .arcade-joystick {
      width: 80px;
      height: 80px;
      background: #333;
      border-radius: 50%;
      border: 5px solid #111;
      box-shadow: inset 0 -10px 15px rgba(0,0,0,0.5), 0 10px 10px rgba(0,0,0,0.3);
    }

    .arcade-footer {
      margin-top: 20px;
      color: #fff;
      font-size: 12px;
      text-align: center;
      text-shadow: 2px 2px 0 #000;
    }

    /* Estilos del panel de información */
    .info-item {
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid #333;
    }

    .info-title {
      color: #ff0;
      margin-bottom: 5px;
      font-size: 14px;
    }

    .info-value {
      font-size: 16px;
      margin-bottom: 5px;
    }

    .progress-container {
      width: 100%;
      height: 10px;
      background: #333;
      margin-top: 5px;
      border-radius: 5px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: #28a745;
      transition: width 0.3s;
    }

    .progress-bar.nitro { background: #007bff; }
    .progress-bar.plates { background: #ffc107; }

    .lives-container {
      display: flex;
      gap: 5px;
      margin-top: 5px;
    }

    .life {
      width: 15px;
      height: 15px;
      background: red;
      border-radius: 50%;
    }

    .combo-container {
      margin-top: 10px;
      padding: 5px;
      background: rgba(255, 215, 0, 0.2);
      border-radius: 5px;
      display: none;
    }

    .combo-value { color: #ff0; font-weight: bold; }

    /* Estilos para móvil */
    @media (max-width: 768px) {
      body {
        background: #111;
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
        touch-action: manipulation;
        margin: 0;
        padding: 0;
      }
      
      .arcade-machine { display: none; }
      
      #game-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }
      
      canvas {
        width: 100vw !important;
        height: 100vh !important;
        display: block;
        object-fit: contain;
      }

      .mobile-hud {
        position: absolute;
        top: 10px;
        left: 0;
        right: 0;
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        align-items: flex-start;
        gap: 1px;
        z-index: 20;
        pointer-events: none;
        font-size: 12px;
        padding: 0 10px;
        box-sizing: border-box;
      }

      .mobile-hud-left,
      .mobile-hud-right {
        display: flex;
        flex-direction: row;
        align-items: center;
        border-radius: 8px;
        padding: 6px 10px;
        flex-wrap: wrap;
        max-width: 70%;
        gap: 0px;
      }

      .mobile-hud-left { flex-grow: 1; }
      .mobile-hud-right { margin-left: auto; }

      .mobile-hud-item {
        background: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 6px 10px;
        border-radius: 8px;
        font-size: 12px;
        font-weight: bold;
        text-align: center;
        text-shadow: 1px 1px 2px black;
        margin: -1px;
        white-space: nowrap;
        flex-shrink: 0;
      }

      .mobile-progress-container {
        width: 100%;
        height: 8px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 4px;
        margin-top: 3px;
        overflow: hidden;
      }

      .mobile-progress-bar {
        height: 100%;
        background: #28a745;
        transition: width 0.3s;
      }

      .mobile-progress-bar.nitro { background: #007bff; }

      .mobile-hud-right .mobile-hud-item { min-width: 100px; text-align: center; }

      .mobile-hud-combo {
        position: absolute;
        top: 640px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(255, 215, 0, 0.9);
        color: black;
        padding: 8px 15px;
        border-radius: 20px;
        font-size: 14px;
        font-weight: bold;
        display: none;
        white-space: nowrap;
      }

      .touch-control {
        position: fixed;
        top: 0;
        bottom: 0;
        width: 30%;
        z-index: 10;
        opacity: 0.3;
      }
      
      #left-control {
        left: 0;
        background: rgba(0, 0, 255, 0.1);
      }
      
      #right-control {
        right: 0;
        background: rgba(255, 0, 0, 0.1);
      }
      
      .direction-btn {
        position: fixed;
        width: 70px;
        height: 70px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.3);
        border: 2px solid rgba(255, 255, 255, 0.5);
        color: white;
        font-size: 28px;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 15;
        touch-action: manipulation;
        user-select: none;
        transition: transform 0.1s;
      }
      
      .direction-btn:active {
        transform: scale(0.9);
        background: rgba(255, 255, 255, 0.5);
      }
      
      #btnLeft { left: 20px; bottom: 100px; }
      #btnRight { right: 20px; bottom: 100px; }
      
      #btnNitro {
        position: fixed;
        bottom: 100px;
        left: 90%;
        transform: translateX(-50%);
        padding: 15px;
        margin: 0;
        font-size: 24px;
        background: rgba(255, 87, 34, 0.7);
        border: 2px solid rgba(255, 255, 255, 0.7);
        color: white;
        border-radius: 50%;
        width: 70px;
        height: 70px;
        touch-action: manipulation;
        z-index: 10;
        transition: transform 0.1s;
      }
      
      #btnNitro:active {
        transform: translateX(-50%) scale(0.9);
        background: rgba(255, 87, 34, 0.9);
      }
    }

    @media (max-width: 768px) and (orientation: portrait) {
      .mobile-hud { flex-direction: row; align-items: flex-start; gap: 5px; }
      .mobile-hud-item { margin-bottom: 5px; }
      .mobile-hud-right { align-items: flex-start; }
      #btnLeft { left: 20px; bottom: 100px; }
      #btnRight { right: 20px; bottom: 100px; }
      #btnNitro { left: 88%; bottom: 200px; transform: translateX(-50%); }
    }

    @media (max-width: 768px) and (orientation: landscape) {
      .mobile-hud { font-size: 10px; }
      .mobile-hud-item { padding: 4px 6px; }
      #btnLeft { left: 20px; bottom: 20px; }
      #btnRight { right: 20px; bottom: 20px; }
      #btnNitro { left: 90%; bottom: 20px; }
    }

    #game-container { position: relative; }
    canvas { display: block; background: #111; }

    /* Pantalla de carga */
    #loading-screen {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      gap: 20px;
    }

    @media (min-width: 769px) {
      #loading-screen { background: url('imagenes/cargaInicioPC_1.png') center/cover no-repeat; }
    }

    @media (max-width: 768px) {
      #loading-screen { background: url('imagenes/cargaInicioMovil_1.png') center/cover no-repeat; }
    }

    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 5px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 1s ease-in-out infinite;
    }

    .loading-progress {
      width: 200px;
      height: 20px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      overflow: hidden;
    }

    .loading-progress-bar {
      height: 100%;
      background: #28a745;
      width: 0%;
      transition: width 0.3s;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text { color: white; font-size: 18px; text-shadow: 0 0 5px #000; }

    #inicio {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
      gap: 15px;
      padding: 20px;
      box-sizing: border-box;
      display: none;
    }

    @media (min-width: 769px) {
      #inicio { background: url('imagenes/fondoComputadora_1.png') center/cover no-repeat, rgba(0, 0, 0, 0.7); background-blend-mode: overlay; }
    }

    @media (max-width: 768px) {
      #inicio { background: url('imagenes/fondo_movil_1.png') center/cover no-repeat, rgba(0, 0, 0, 0.7); background-blend-mode: overlay; }
    }

    #inicio h2 { font-size: 28px; color: gold; text-shadow: 0 0 5px #fff; margin-bottom: 10px; text-align: center; }

    #inicio input, #inicio select {
      padding: 12px;
      font-size: 18px;
      margin: 5px 0;
      border: none;
      border-radius: 8px;
      width: 250px;
      text-align: center;
      background: #222;
      color: white;
    }

    #inicio button {
      padding: 12px 25px;
      font-size: 18px;
      background: #28a745;
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.2s, background 0.2s;
      width: 100%;
      max-width: 300px;
      margin: 5px auto;
    }

    #inicio button:active { transform: scale(0.95); }

    #btnActivarSonido { background: #6c757d; margin-bottom: 10px; }

    #gameOverScreen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.9);
      z-index: 30;
      gap: 15px;
    }

    #gameOverText { color: red; font-size: 42px; margin-bottom: 10px; text-align: center; text-shadow: 0 0 10px #ff0000; }

    #btnReiniciar {
      padding: 12px 25px;
      font-size: 18px;
      background: #ff5722;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 20px;
      display: none;
      font-weight: bold;
    }

    .tienda { color: cyan; font-size: 16px; text-align: center; margin: 10px 0; font-weight: bold; }

    .vehicle-selector-container { margin-bottom: 15px; width: 100%; }
    .vehicle-selector { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }

    .vehicle-option {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
      border: 2px solid #555;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      background: rgba(0, 0, 0, 0.5);
      width: 100px;
      text-align: center;
    }

    .vehicle-option:hover { border-color: gold; background: rgba(255, 215, 0, 0.2); transform: translateY(-3px); }
    .vehicle-option.selected { border-color: cyan; background: rgba(0, 255, 255, 0.2); box-shadow: 0 0 10px rgba(0, 255, 255, 0.5); }

    .vehicle-thumb { width: 50px; height: 30px; object-fit: contain; margin-bottom: 5px; image-rendering: pixelated; }
    .vehicle-option span { font-size: 14px; color: white; text-shadow: 1px 1px 2px black; }
  </style>
</head>
<body>
  <div id="loading-screen">
    <div class="loading-spinner"></div>
    <div class="loading-progress">
      <div class="loading-progress-bar" id="loading-progress-bar"></div>
    </div>
    <div class="loading-text" id="loading-text">Cargando... 0%</div>
  </div>

  <div id="desktop-view">
    <div class="arcade-machine">
      <div class="arcade-title">PATRULLA RUNNER</div>
      <div class="arcade-screen-container">
        <div class="arcade-screen">
          <div id="game-container-desktop">
            <canvas id="game-desktop" width="400" height="600"></canvas>
            <div class="arcade-bezel"></div>
          </div>
        </div>
        <div class="arcade-info-panel">
          <div class="info-item"><div class="info-title">POLICÍA</div><div class="info-value" id="desktop-player">-</div></div>
          <div class="info-item"><div class="info-title">PUNTOS</div><div class="info-value" id="desktop-score">0</div></div>
          <div class="info-item"><div class="info-title">NIVEL</div><div class="info-value" id="desktop-level">1</div></div>
          <div class="info-item"><div class="info-title">PRÓX. NIVEL</div><div class="progress-container"><div class="progress-bar" id="desktop-level-progress" style="width: 0%"></div></div></div>
          <div class="info-item"><div class="info-title">RÉCORD</div><div class="info-value" id="desktop-highscore">0</div></div>
          <div class="info-item"><div class="info-title">NITRO</div><div class="progress-container"><div class="progress-bar nitro" id="desktop-nitro-progress" style="width: 100%"></div></div></div>
          <div class="info-item"><div class="info-title">VIDAS</div><div class="lives-container" id="desktop-lives"><div class="life"></div><div class="life"></div><div class="life"></div></div></div>
          <div class="info-item"><div class="info-title">PLACAS PARA VIDA</div><div class="info-value" id="desktop-plates">0/50</div><div class="progress-container"><div class="progress-bar plates" id="desktop-plates-progress" style="width: 0%"></div></div></div>
          <div class="info-item"><div class="info-title">ESCUDOS</div><div class="info-value" id="desktop-shields">0/2</div><div class="progress-container"><div class="progress-bar" id="desktop-shields-progress" style="width: 0%; background: cyan"></div></div></div>
          <div class="combo-container" id="desktop-combo-container"><div class="info-title">COMBO ACTIVO</div><div class="combo-value" id="desktop-combo">x1</div></div>
        </div>
      </div>
      <div class="arcade-controls"><div class="arcade-joystick"></div><div class="arcade-button"></div><div class="arcade-button"></div></div>
      <div class="arcade-footer">© 2024 POLICIA ARCADE</div>
    </div>
  </div>

  <div id="mobile-view" style="display: none;">
    <div id="game-container-mobile">
      <canvas id="game-mobile" width="400" height="600"></canvas>
      
      <div class="mobile-hud">
        <div class="mobile-hud-left">
          <div class="mobile-hud-item" id="mobile-player">👮‍♂️: -</div>
          <div class="mobile-hud-item" id="mobile-lives">♥️: 3</div>
          <div class="mobile-hud-item" id="mobile-score">💎: 0</div>
          <div class="mobile-hud-item" id="mobile-shields">🛡️: 0/2</div>
          <div class="mobile-hud-item" id="mobile-plates">🟡: 0/50</div>
        </div>
        
        <div class="mobile-hud-right">
          <div class="mobile-hud-item" id="mobile-level">🏆: 1</div>
          <div class="mobile-hud-item"><div>🚩: 0%</div><div class="mobile-progress-container"><div class="mobile-progress-bar" id="mobile-next-level-bar" style="width: 0%"></div></div></div>
          <div class="mobile-hud-item"><div>⚡: 100%</div><div class="mobile-progress-container"><div class="mobile-progress-bar nitro" id="mobile-nitro-bar" style="width: 100%"></div></div></div>
        </div>
      </div>
      
      <div class="mobile-hud-combo" id="mobile-combo">COMBO x1</div>
      
      <div id="left-control" class="touch-control"></div>
      <div id="right-control" class="touch-control"></div>
      
      <div id="btnLeft" class="direction-btn">←</div>
      <div id="btnRight" class="direction-btn">→</div>
      
      <button id="btnNitro">💨</button>
    </div>
  </div>

  <div id="inicio">
    <h2>Patrulla Runner</h2>
    <button id="btnActivarSonido">🔊 Activar Sonido</button>
    <input id="nombreJugador" type="text" placeholder="Tu nombre..." maxlength="20" />
    
    <div class="vehicle-selector-container">
      <label style="color: white; margin-bottom: 5px; display: block; text-align: center;">Selecciona tu vehículo:</label>
      <div class="vehicle-selector">
        <div class="vehicle-option selected" data-value="imagenes/patrulla_1.png"><img src="imagenes/patrulla_1.png" alt="Patrulla de Cuadrante" class="vehicle-thumb"><span>Cuadrante</span></div>
        <div class="vehicle-option" data-value="imagenes/transito_1.png"><img src="imagenes/transito_1.png" alt="Patrulla de Tránsito" class="vehicle-thumb"><span>Tránsito</span></div>
        <div class="vehicle-option" data-value="imagenes/pbi_1.png"><img src="imagenes/pbi_1.png" alt="Patrulla P.B.I." class="vehicle-thumb"><span>P.B.I.</span></div>
        <div class="vehicle-option" data-value="imagenes/auxiliar_1.png"><img src="imagenes/auxiliar_1.png" alt="Patrulla Auxiliar" class="vehicle-thumb"><span>P.A.</span></div>
      </div>
      <input type="hidden" id="colorPatrulla" value="imagenes/patrulla_1.png">
    </div>
    
    <div class="tienda"><div id="puntosTotales"></div></div>
    <button onclick="iniciarJuego()">🚀 Jugar</button>
  </div>

  <div id="gameOverScreen">
    <div id="gameOverText">¡Patrullaje Fallido!</div>
    <div id="puntosFinales"></div>
    <div id="highScoreFinal"></div>
    <div id="maxComboFinal"></div>
    <button id="btnReiniciar">🔄 Volver a Patrullar</button>
  </div>

  <script>
    (function() {
      // ==================== CONSTANTES ====================
      const CONSTANTS = {
        CANVAS_WIDTH: 400,
        CANVAS_HEIGHT: 600,
        LEFT_BORDER: 40,
        RIGHT_BORDER: 360,
        BORDER_WIDTH: 8,
        INITIAL_SPEED: 5,
        MAX_SPEED: 15,
        MIN_SPEED: 3,
        NITRO_BOOST: 3,
        NITRO_REGEN_SPEED: 0.2,
        NITRO_CONSUMPTION_INTERVAL: 50,
        NITRO_ITEM_BASE_INTERVAL: 15000,
        PLACAS_BASE_FOR_VIDA: 50,
        INVULNERABLE_TIME: 1000,
        DESLIZAMIENTO_MAX_TIME: 1000,
        COMBO_RESET_TIME: 3000,
        MAX_ESCUDOS: 2,
        MAX_PARTICLES: 100,
        MAX_DERRAPE_MARKS: 10,
        CLIMA_DURATION_MIN: 15000,
        CLIMA_DURATION_MAX: 30000,
        RAYO_ADVERTENCIA_TIME: 1500,
        RAYO_IMPACTO_TIME: 150,
        CRATER_LIFETIME: 3000,
        SHAKE_INTENSITY: 10,
        SHAKE_FRAMES: 15
      };

      // ==================== ESTADO DEL JUEGO ====================
      const GameState = {
        // Jugador
        nombreJugador: '',
        patrulla: { x: 180, y: CONSTANTS.CANVAS_HEIGHT - 100, width: 40, height: 60, targetX: 180 },
        vidas: 3,
        escudosRecolectados: 0,
        tiempoBloqueoChalecos: 0,
        
        // Puntuación
        score: 0,
        highScore: 0,
        totalPuntos: 0,
        combo: 0,
        maxCombo: 0,
        tiempoUltimaPlaca: 0,
        comboTimeout: null,
        
        // Nivel
        level: 1,
        speed: CONSTANTS.INITIAL_SPEED,
        tiempoUltimoLevelUp: 0,
        
        // Nitro
        nitro: 100,
        nitroActivo: false,
        nitroSoundPlaying: false,
        nitroConsumptionInterval: null,
        
        // Progresión
        placasRecolectadasDesdeUltimaVida: 0,
        nitroItemInterval: CONSTANTS.NITRO_ITEM_BASE_INTERVAL,
        placasParaVida: CONSTANTS.PLACAS_BASE_FOR_VIDA,
        ultimoNitroItemTiempo: 0,

            audio.currentTime = 0;
          } else {
            audio.currentTime = 0;
            await audio.play();
            audio.playing = true;
            audio.addEventListener('ended', () => { audio.playing = false; }, { once: true });
          }
        } catch (e) {
          console.warn('Error reproduciendo sonido:', e);
          audio.playing = false;
        }

      // ==================== FUNCIONES DE COLISIÓN ====================
      function checkRectCollision(rect1, rect2) {
        return rect1.x < rect2.x + rect2.width &&
               rect1.x + rect1.width > rect2.x &&
               rect1.y < rect2.y + rect2.height &&
               rect1.y + rect1.height > rect2.y;
      }

      function checkCircleCollision(rect, circle) {
        const closestX = Math.max(rect.x, Math.min(circle.x, rect.x + rect.width));
        const closestY = Math.max(rect.y, Math.min(circle.y, rect.y + rect.height));
        const dx = circle.x - closestX;
        const dy = circle.y - closestY;
        return (dx * dx + dy * dy) < (circle.size * circle.size);
      }

      // ==================== FUNCIONES DE PARTÍCULAS ====================
      function addParticle(array, particle, max = CONSTANTS.MAX_PARTICLES) {
        if (array.length < max) {
          array.push(particle);
        }

      function crearEfectoDerrape() {
        const centerX = GameState.patrulla.x + GameState.patrulla.width / 2;
        const wheelWidth = 10;
        
        addParticle(GameState.derrapeMarks, {
          x1: centerX - wheelWidth,
          y1: GameState.patrulla.y + GameState.patrulla.height,
          x2: centerX - wheelWidth,
          y2: GameState.patrulla.y + GameState.patrulla.height + 30 + Math.random() * 20,
          width: 3 + Math.random() * 2,
          alpha: 0.8
        }, CONSTANTS.MAX_DERRAPE_MARKS);
        
        addParticle(GameState.derrapeMarks, {
          x1: centerX + wheelWidth,
          y1: GameState.patrulla.y + GameState.patrulla.height,
          x2: centerX + wheelWidth,
          y2: GameState.patrulla.y + GameState.patrulla.height + 30 + Math.random() * 20,
          width: 3 + Math.random() * 2,
          alpha: 0.8
        }, CONSTANTS.MAX_DERRAPE_MARKS);
        
        for (let i = 0; i < 15; i++) {
          addParticle(GameState.humoParticles, {
            x: centerX + (Math.random() - 0.5) * wheelWidth * 1.5,
            y: GameState.patrulla.y + GameState.patrulla.height - 5 + Math.random() * 30,
            size: 5 + Math.random() * 15,

          });
        }
        
        GameState.shakeFrames = 5;

      // ==================== FUNCIONES DE NITRO ====================
      async function activarNitro() {
        if (GameState.nitro > 0 && !GameState.nitroActivo && !GameState.juegoPausado) {
          GameState.nitroActivo = true;
          GameState.speed += CONSTANTS.NITRO_BOOST;
          
          if (!GameState.nitroSoundPlaying && sonidoActivado) {
            try {
              sonidoNitro.currentTime = 0;
              sonidoNitro.loop = true;
              await sonidoNitro.play();
              GameState.nitroSoundPlaying = true;
            } catch (e) {
              console.warn('Error al reproducir sonido nitro');
              GameState.nitroSoundPlaying = false;
            }
          }
          
          GameState.nitroConsumptionInterval = setInterval(() => {
            if (GameState.nitroActivo && GameState.nitro > 0 && !GameState.juegoPausado) {
              GameState.nitro -= 1;
              if (GameState.nitro <= 0) {
                GameState.nitro = 0;
                desactivarNitro();
              }
              updateHUD();
            }
          }, 50);
        }
      }

      async function desactivarNitro() {
        if (GameState.nitroActivo) {
          GameState.nitroActivo = false;
          GameState.speed -= CONSTANTS.NITRO_BOOST;
          
          if (GameState.nitroSoundPlaying) {
            try {
              sonidoNitro.pause();
              sonidoNitro.currentTime = 0;
              GameState.nitroSoundPlaying = false;
            } catch (e) {}
          }
          
          clearInterval(GameState.nitroConsumptionInterval);
          if (sonidoActivado) {
            await reproducirSonido(sonidoFrenoDerrape);
          }
          crearEfectoDerrape();
        }
      }

      // ==================== FUNCIONES DE CLIMA ====================
      function cambiarClima() {
        const ahora = Date.now();
        
        if (GameState.tiempoDuracionClima === 0) {
          GameState.tiempoDuracionClima = CONSTANTS.CLIMA_DURATION_MIN + Math.random() * (CONSTANTS.CLIMA_DURATION_MAX - CONSTANTS.CLIMA_DURATION_MIN);
        }
        
        if (ahora - GameState.tiempoCambioClima > GameState.tiempoDuracionClima) {
          const climas = ['normal', 'niebla', 'tormenta', 'viento', 'nieve', 'arena', 'granizo', 'noche'];
          GameState.climaActual = climas[Math.floor(Math.random() * climas.length)];
          
          if (GameState.climaActual === 'granizo') {
            const opciones = ['nieve', 'lluvia'];
            GameState.climaSecundario = opciones[Math.floor(Math.random() * opciones.length)];
          } else if (GameState.climaActual === 'tormenta') {
            GameState.climaSecundario = 'lluvia';
          } else {
            GameState.climaSecundario = null;
          }
          
          GameState.tiempoDuracionClima = CONSTANTS.CLIMA_DURATION_MIN + Math.random() * (CONSTANTS.CLIMA_DURATION_MAX - CONSTANTS.CLIMA_DURATION_MIN);
          GameState.tiempoCambioClima = ahora;
          
          // Limpiar partículas anteriores
          GameState.hojas = [];
          GameState.copos = [];
          GameState.arena = [];
          GameState.granizos = [];
          GameState.gotas = [];
          GameState.rayos = [];
          GameState.crateres = [];
          GameState.particulasRayos = [];
          GameState.particulasCrateres = [];
          
          GameState.nieblaActiva = GameState.climaActual === 'niebla';
          GameState.nocheActiva = GameState.climaActual === 'noche';
          GameState.vientoActivo = GameState.climaActual === 'viento';
          
          if (sonidoActivado) {
            sonidoViento.pause();
            sonidoNieve.pause();
            sonidoNoche.pause();
            
            if (GameState.climaActual === 'viento') {
              sonidoViento.currentTime = 0;
              sonidoViento.play().catch(() => {});
            } else if (GameState.climaActual === 'nieve' || (GameState.climaActual === 'granizo' && GameState.climaSecundario === 'nieve')) {
              sonidoNieve.currentTime = 0;
              sonidoNieve.play().catch(() => {});
            } else if (GameState.climaActual === 'noche') {
              sonidoNoche.currentTime = 0;
              sonidoNoche.play().catch(() => {});
            }
          }
        }
      }

      async function drawTormenta() {
        if (GameState.climaActual !== 'tormenta') return;
        
        const ahora = Date.now();
        
        if (ahora - GameState.ultimoTrueno > 5000 + Math.random() * 3000) {
          GameState.ultimoTrueno = ahora;
          
          gameCanvas.style.backgroundColor = 'white';
          setTimeout(() => { gameCanvas.style.backgroundColor = fondoPorNivel(); }, 100);
          
          if (sonidoActivado) {
            try {
              sonidoTrueno.currentTime = 0;
              await sonidoTrueno.play();
            } catch (e) {}
          }
          
          const x = CONSTANTS.LEFT_BORDER + CONSTANTS.BORDER_WIDTH + Math.random() * (CONSTANTS.RIGHT_BORDER - CONSTANTS.LEFT_BORDER - 2 * CONSTANTS.BORDER_WIDTH);
          GameState.rayos.push({
            x, y: 0,
            estado: 'advertencia',
            tiempoInicio: ahora,
            tiempoAdvertencia: CONSTANTS.RAYO_ADVERTENCIA_TIME,
            tiempoImpacto: CONSTANTS.RAYO_IMPACTO_TIME,
            ancho: 20 + Math.random() * 30,
            ramificaciones: Math.floor(Math.random() * 3) + 1,
            impactoRegistrado: false
          });
        }
        
        for (let i = GameState.rayos.length - 1; i >= 0; i--) {
          const rayo = GameState.rayos[i];
          
          if (rayo.estado === 'advertencia' && ahora - rayo.tiempoInicio > rayo.tiempoAdvertencia) {
            rayo.estado = 'impacto';
            rayo.tiempoInicio = ahora;
            
            for (let j = 0; j < 30; j++) {
              addParticle(GameState.particulasRayos, {
                x: rayo.x + (Math.random() - 0.5) * rayo.ancho,
                y: Math.random() * CONSTANTS.CANVAS_HEIGHT,
                size: 2 + Math.random() * 5,
                alpha: 0.8,
                speedX: (Math.random() - 0.5) * 5,
                speedY: -Math.random() * 10,
                decay: 0.02 + Math.random() * 0.03,
                color: `rgba(255, ${200 + Math.random() * 55}, 0, 1)`
              });
            }
            
            if (!rayo.impactoRegistrado) {
              rayo.impactoRegistrado = true;
              
              if (GameState.patrulla.x < rayo.x + rayo.ancho/2 &&
                  GameState.patrulla.x + GameState.patrulla.width > rayo.x - rayo.ancho/2) {
                
                if (GameState.escudosRecolectados >= 2) {
                  GameState.escudosRecolectados = 1;
                  await reproducirSonido(sonidoAntiPowerup);
                } else if (GameState.escudosRecolectados === 1) {
                  GameState.escudosRecolectados = 0;
                  GameState.vidas--;
                  await reproducirSonido(sonidoChoque);
                } else {
                  GameState.vidas = Math.max(0, GameState.vidas - 2);
                  await reproducirSonido(sonidoChoque);
                }
                
                GameState.shakeFrames = CONSTANTS.SHAKE_FRAMES;
                GameState.tiempoUltimoChoque = ahora;
                
                if (GameState.vidas <= 0) {
                  gameOverHandler();
                }
                
                updateHUD();
              }
              
              GameState.crateres.push({
                x: rayo.x - 20,
                y: CONSTANTS.CANVAS_HEIGHT - 40,
                width: 40,
                height: 30,
                tiempoCreacion: ahora
              });
              
              if (sonidoActivado) {
                try {
                  sonidoImpactoRayo.currentTime = 0;
                  sonidoImpactoRayo.volume = 0.7;
                  await sonidoImpactoRayo.play();
                } catch (e) {}
              }
            }
          } else if (rayo.estado === 'impacto' && ahora - rayo.tiempoInicio > rayo.tiempoImpacto) {
            GameState.rayos.splice(i, 1);
          }
        }
      }

      function aplicarEfectosClimaticos() {
        if (GameState.vientoActivo) {
          GameState.patrulla.targetX += (Math.random() - 0.5) * 5;
          GameState.patrulla.targetX = Math.max(CONSTANTS.LEFT_BORDER + CONSTANTS.BORDER_WIDTH, 
            Math.min(CONSTANTS.RIGHT_BORDER - CONSTANTS.BORDER_WIDTH - GameState.patrulla.width, GameState.patrulla.targetX));
        }
      }

      // ==================== FUNCIONES DE COLISIONES ====================
      async function checkCollisions() {
        const ahora = Date.now();
        const invulnerable = ahora - GameState.tiempoUltimoChoque < CONSTANTS.INVULNERABLE_TIME;
        
        // Objetivos (placas)
        for (let i = GameState.objetivos.length - 1; i >= 0; i--) {
          const obj = GameState.objetivos[i];
          if (checkRectCollision(GameState.patrulla, obj)) {
            GameState.objetivos.splice(i, 1);
            
            if (ahora - GameState.tiempoUltimaPlaca < CONSTANTS.COMBO_RESET_TIME) {
              GameState.combo++;
              GameState.maxCombo = Math.max(GameState.maxCombo, GameState.combo);
              
              if (GameState.comboTimeout) clearTimeout(GameState.comboTimeout);
              GameState.comboTimeout = setTimeout(() => {
                GameState.combo = 0;
                updateHUD();
              }, CONSTANTS.COMBO_RESET_TIME);
            } else {
              GameState.combo = 1;
            }
            
            GameState.tiempoUltimaPlaca = ahora;
            
            const puntosBase = 100;
            const puntosConCombo = puntosBase * GameState.combo;
            GameState.score += puntosConCombo;
            GameState.placasRecolectadasDesdeUltimaVida++;
            
            if (sonidoActivado) {
              await reproducirSonido(sonidoPunto);
            }
            
            if (GameState.placasRecolectadasDesdeUltimaVida >= GameState.placasParaVida) {
              spawnVidaItem();
            }
            
            updateHUD();
            break;
          }
        }
        
        // Powerups (escudos)
        for (let i = GameState.powerups.length - 1; i >= 0; i--) {
          const pw = GameState.powerups[i];
          if (checkRectCollision(GameState.patrulla, pw)) {
            GameState.powerups.splice(i, 1);
            
            if (GameState.escudosRecolectados < CONSTANTS.MAX_ESCUDOS && ahora - GameState.tiempoBloqueoChalecos > 10000) {
              GameState.escudosRecolectados++;
              if (sonidoActivado) await reproducirSonido(sonidoPowerup);
            } else {
              GameState.score += 200;
              if (sonidoActivado) await reproducirSonido(sonidoPunto);
            }
            
            updateHUD();
            break;
          }
        }
        
        // Nitro items
        for (let i = GameState.nitroItems.length - 1; i >= 0; i--) {
          const item = GameState.nitroItems[i];
          if (checkRectCollision(GameState.patrulla, { x: item.x, y: item.y, width: 30, height: 30 })) {
            GameState.nitroItems.splice(i, 1);
            GameState.nitro = Math.min(100, GameState.nitro + 30);
            if (sonidoActivado) await reproducirSonido(sonidoPowerup);
            updateHUD();
            break;
          }
        }
        
        // Vida items
        for (let i = GameState.vidaItems.length - 1; i >= 0; i--) {
          const item = GameState.vidaItems[i];
          if (checkRectCollision(GameState.patrulla, { x: item.x, y: item.y, width: 30, height: 30 })) {
            GameState.vidaItems.splice(i, 1);
            GameState.vidas = Math.min(3, GameState.vidas + 1);
            if (sonidoActivado) await reproducirSonido(sonidoVida);
            updateHUD();
            break;
          }
        }
        
        // Trampas de clavos
        for (let i = GameState.trampaClavosItems.length - 1; i >= 0; i--) {
          const item = GameState.trampaClavosItems[i];
          if (checkRectCollision(GameState.patrulla, { x: item.x, y: item.y, width: item.width, height: item.height })) {
            GameState.trampaClavosItems.splice(i, 1);
            
            if (GameState.escudosRecolectados > 0) {
              GameState.escudosRecolectados--;
              GameState.tiempoBloqueoChalecos = ahora;
              await reproducirSonido(sonidoAntiPowerup);
            } else {
              GameState.vidas--;
              GameState.combo = 0;
              GameState.shakeFrames = 10;
              GameState.tiempoUltimoChoque = ahora;
              
              if (sonidoActivado) await reproducirSonido(sonidoTrampaClavos);
              
              if (GameState.vidas <= 0) {
                gameOverHandler();
              }
            }
            
            updateHUD();
            break;
          }
        }
        
        // Conos
        for (let i = GameState.conos.length - 1; i >= 0; i--) {
          const cono = GameState.conos[i];
          if (checkRectCollision(GameState.patrulla, cono)) {
            GameState.conos.splice(i, 1);
            
            if (GameState.escudosRecolectados > 0) {
              GameState.escudosRecolectados--;
              GameState.tiempoBloqueoChalecos = ahora;
              await reproducirSonido(sonidoAntiPowerup);
            } else {
              GameState.vidas--;
              GameState.combo = 0;
              GameState.shakeFrames = 10;
              GameState.tiempoUltimoChoque = ahora;
              
              if (sonidoActivado) await reproducirSonido(sonidoCono);
              
              if (GameState.vidas <= 0) {
                gameOverHandler();
              }
            }
            
            updateHUD();
            break;
          }
        }
        
        // Aceite
        for (let i = GameState.aceites.length - 1; i >= 0; i--) {
          const aceite = GameState.aceites[i];
          if (checkCircleCollision(GameState.patrulla, aceite)) {
            if (GameState.escudosRecolectados === 0 && !invulnerable && !GameState.deslizando) {
              GameState.deslizando = true;
              GameState.tiempoDeslizamiento = ahora;
              
              if (sonidoActivado) await reproducirSonido(sonidoAceite);
              
              crearEfectoDerrape();
            }
            GameState.aceites.splice(i, 1);
            break;
          }
        }
        
        // Obstáculos
        for (let i = GameState.obstacles.length - 1; i >= 0; i--) {
          const obs = GameState.obstacles[i];
          if (checkRectCollision(GameState.patrulla, obs)) {
            if (!invulnerable) {
              if (GameState.escudosRecolectados > 0) {
                GameState.escudosRecolectados--;
                GameState.tiempoBloqueoChalecos = ahora;
                await reproducirSonido(sonidoAntiPowerup);
              } else {
                GameState.vidas--;
                GameState.combo = 0;
                GameState.shakeFrames = 15;
                GameState.tiempoUltimoChoque = ahora;
                
                if (sonidoActivado) await reproducirSonido(sonidoChoque);
                
                if (GameState.vidas <= 0) {
                  gameOverHandler();
                }
              }
              
              updateHUD();
            }
            GameState.obstacles.splice(i, 1);
            break;
          }
        }
      }

      function gameOverHandler() {
        GameState.gameOver = true;
        musicaFondo.pause();
        desactivarNitro();
        pausarTodosLosSonidos();
        
        document.getElementById('gameOverScreen').style.display = 'flex';
        document.getElementById('btnReiniciar').style.display = 'block';
        document.getElementById('puntosFinales').textContent = `Puntos: ${GameState.score}`;
        document.getElementById('highScoreFinal').textContent = `Récord: ${GameState.highScore}`;
        document.getElementById('maxComboFinal').textContent = `Máximo Combo: ${GameState.maxCombo}`;
      }

      // ==================== FUNCIONES DE DIBUJADO ====================
      function fondoPorNivel() {
        if (GameState.nocheActiva) return '#001122';
        if (GameState.level <= 2) return '#222';
        if (GameState.level <= 4) return '#001144';
        return '#552200';
      }

      function drawRoadLines(ctx) {
        ctx.strokeStyle = 'gold';
        ctx.lineWidth = CONSTANTS.BORDER_WIDTH;
        
        ctx.beginPath();
        ctx.moveTo(CONSTANTS.LEFT_BORDER, 0);
        ctx.lineTo(CONSTANTS.LEFT_BORDER, CONSTANTS.CANVAS_HEIGHT);
        ctx.stroke();
        
        ctx.beginPath();
        ctx.moveTo(CONSTANTS.RIGHT_BORDER, 0);
        ctx.lineTo(CONSTANTS.RIGHT_BORDER, CONSTANTS.CANVAS_HEIGHT);
        ctx.stroke();
        
        if (GameState.level >= 5) {
          ctx.strokeStyle = `hsl(${Date.now()/50 % 360}, 80%, 50%)`;
        } else {
          ctx.strokeStyle = 'white';
        }
        ctx.lineWidth = 3;
        
        const linePositions = [120, 200, 280];
        const lineHeight = 30;
        const lineGap = 50;
        
        let lineOffset = (GameState.frameCount * GameState.speed * 0.5) % (lineGap + lineHeight);
        
        linePositions.forEach(posX => {
          for (let y = -lineHeight; y < CONSTANTS.CANVAS_HEIGHT; y += lineGap + lineHeight) {
            const lineY = y + lineOffset;
            ctx.beginPath();
            ctx.moveTo(posX, lineY);
            ctx.lineTo(posX, lineY + lineHeight);
            ctx.stroke();
          }
        });
      }

      function drawAceites(ctx) {
        GameState.aceites.forEach(aceite => {
          ctx.beginPath();
          ctx.ellipse(aceite.x, aceite.y, aceite.size, aceite.size * 0.7, 0, 0, Math.PI * 2);
          
          const gradient = ctx.createRadialGradient(
            aceite.x, aceite.y, aceite.size * 0.3,
            aceite.x, aceite.y, aceite.size
          );
          gradient.addColorStop(0, 'rgba(50, 50, 50, 0.8)');
          gradient.addColorStop(0.5, 'rgba(20, 20, 20, 0.9)');
          gradient.addColorStop(1, 'rgba(0, 0, 0, 0.7)');
          
          ctx.fillStyle = gradient;
          ctx.fill();
          
          ctx.beginPath();
          ctx.ellipse(
            aceite.x - aceite.size * 0.3, 
            aceite.y - aceite.size * 0.2, 
            aceite.size * 0.15, 
            aceite.size * 0.1, 
            0, 0, Math.PI * 2
          );
          ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
          ctx.fill();
          
          aceite.y += GameState.speed;
        });
      }

      function drawObstacles(ctx) {
        GameState.obstacles.forEach(obs => {
          ctx.fillStyle = '#333';
          ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
          obs.y += GameState.speed;
        });
      }

      function drawObjetivos(ctx) {
        const pulseSize = 0.9 + Math.abs(Math.sin(GameState.pulso * 2)) * 0.2;
        
        GameState.objetivos.forEach(obj => {
          ctx.fillStyle = 'gold';
          ctx.beginPath();
          ctx.arc(obj.x + 15, obj.y + 15, 15 * pulseSize, 0, Math.PI * 2);
          ctx.fill();
          
          ctx.fillStyle = 'black';
          ctx.font = 'bold 12px Arial';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('P', obj.x + 15, obj.y + 15);
          
          obj.y += GameState.speed;
        });
      }

      function drawPowerups(ctx) {
        const floatOffset = Math.sin(Date.now() * 0.005) * 3;
        const pulseSize = 0.9 + Math.abs(Math.sin(GameState.pulso * 2)) * 0.2;
        
        GameState.powerups.forEach(pw => {
          ctx.fillStyle = 'cyan';
          ctx.beginPath();
          ctx.arc(pw.x + 15, pw.y + 15 + floatOffset, 15 * pulseSize, 0, Math.PI * 2);
          ctx.fill();
          
          ctx.fillStyle = 'white';
          ctx.font = 'bold 12px Arial';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('S', pw.x + 15, pw.y + 15 + floatOffset);
          
          pw.y += GameState.speed;
        });
      }

      function drawNitroItems(ctx) {
        const floatOffset = Math.sin(Date.now() * 0.005) * 3;
        
        GameState.nitroItems.forEach(item => {
          ctx.fillStyle = 'orange';
          ctx.fillRect(item.x, item.y + floatOffset, 30, 30);
          
          ctx.fillStyle = 'white';
          ctx.font = 'bold 8px Arial';
          ctx.textAlign = 'center';
          ctx.fillText('NITRO', item.x + 15, item.y + 15 + floatOffset);
          
          item.y += GameState.speed;
        });
      }

      function drawVidaItems(ctx) {
        const floatOffset = Math.sin(Date.now() * 0.005) * 3;
        const pulseSize = 0.9 + Math.abs(Math.sin(GameState.pulso * 2)) * 0.2;
        
        GameState.vidaItems.forEach(item => {
          ctx.fillStyle = '#00CED1';
          ctx.beginPath();
          ctx.arc(item.x + 15, item.y + 15 + floatOffset, (15 * pulseSize)/2, 0, Math.PI * 2);
          ctx.fill();
          
          ctx.fillStyle = 'white';
          ctx.font = 'bold 12px Arial';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('+', item.x + 15, item.y + 15 + floatOffset);
          
          item.y += GameState.speed;
        });
      }

      function drawTrampaClavos(ctx) {
        GameState.trampaClavosItems.forEach(item => {
          ctx.save();
          ctx.translate(item.x + item.width / 2, item.y + item.height / 2);
          ctx.rotate(item.rotation);
          ctx.translate(-(item.x + item.width / 2), -(item.y + item.height / 2));
          
          ctx.fillStyle = '#8B4513';
          ctx.beginPath();
          ctx.arc(item.x + 15, item.y + 15, 15, 0, Math.PI * 2);
          ctx.fill();
          
          ctx.fillStyle = 'black';
          for (let i = 0; i < 8; i++) {
            const angle = (Math.PI * 2 / 8) * i;
            const nailX = item.x + 15 + Math.cos(angle) * 10;
            const nailY = item.y + 15 + Math.sin(angle) * 10;
            ctx.beginPath();
            ctx.moveTo(nailX, nailY);
            ctx.lineTo(item.x + 15 + Math.cos(angle) * 5, item.y + 15 + Math.sin(angle) * 5);
            ctx.lineWidth = 2;
            ctx.strokeStyle = 'silver';
            ctx.stroke();
          }
          
          ctx.restore();
          
          item.y += GameState.speed;
          item.rotation += item.rotationSpeed;
          
          if (item.seMueve) {
            item.x += item.slideDirection * 0.5;
            
            if (item.x < CONSTANTS.LEFT_BORDER + CONSTANTS.BORDER_WIDTH || 
                item.x + item.width > CONSTANTS.RIGHT_BORDER - CONSTANTS.BORDER_WIDTH) {
              item.slideDirection *= -1;
            }
          }
        });
      }

      function drawConos(ctx) {
        GameState.conos.forEach(cono => {
          ctx.fillStyle = 'orange';
          ctx.beginPath();
          ctx.moveTo(cono.x + cono.width/2, cono.y);
          ctx.lineTo(cono.x + cono.width, cono.y + cono.height);
          ctx.lineTo(cono.x, cono.y + cono.height);
          ctx.closePath();
          ctx.fill();
          
          ctx.strokeStyle = 'white';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(cono.x + cono.width/3, cono.y + cono.height/3);
          ctx.lineTo(cono.x + cono.width/2, cono.y + cono.height/2);
          ctx.stroke();
          
          cono.y += GameState.speed;
        });
      }

      function drawHumo(ctx) {
        for (let i = GameState.humoParticles.length - 1; i >= 0; i--) {
          const p = GameState.humoParticles[i];
          ctx.fillStyle = p.color || `rgba(50, 50, 50, ${p.alpha})`;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
          
          p.x += p.speedX;
          p.y += p.speedY;
          p.alpha -= p.decay;
          p.size *= 0.99;
          
          if (p.alpha <= 0) {
            GameState.humoParticles.splice(i, 1);
          }
        }
      }

      function drawDerrapeMarks(ctx) {
        if (GameState.deslizando && GameState.frameCount % 5 === 0) {
          crearEfectoDerrape();
        }
        
        for (let i = GameState.derrapeMarks.length - 1; i >= 0; i--) {
          const mark = GameState.derrapeMarks[i];
          ctx.strokeStyle = `rgba(150, 150, 150, ${mark.alpha})`;
          ctx.lineWidth = mark.width;
          ctx.beginPath();
          ctx.moveTo(mark.x1, mark.y1);
          ctx.lineTo(mark.x2, mark.y2);
          ctx.stroke();
          
          mark.alpha -= 0.01;
          if (mark.alpha <= 0) {
            GameState.derrapeMarks.splice(i, 1);
          }
        }
      }

      function drawPatrulla(ctx) {
        const ahora = Date.now();
        
        if (GameState.vidas === 1 && GameState.frameCount % 5 === 0) {
          const centerX = GameState.patrulla.x + GameState.patrulla.width / 2;
          addParticle(GameState.humoParticles, {
            x: centerX + (Math.random() - 0.5) * 15,
            y: GameState.patrulla.y + GameState.patrulla.height - 10,
            size: 1 + Math.random() * 15,
            alpha: 0.7,
            speedX: (Math.random() - 0.5) * 1.5,
            speedY: -Math.random() * 1.5,
            decay: 0.01 + Math.random() * 0.02,
            color: 'rgba(200, 200, 200, 0.8)'
          });
        }
        
        if (GameState.deslizando) {
          if (ahora - GameState.tiempoDeslizamiento > CONSTANTS.DESLIZAMIENTO_MAX_TIME) {
            GameState.deslizando = false;
          } else {
            GameState.patrulla.x += (Math.random() - 0.5) * 4;
            GameState.patrulla.x = Math.max(CONSTANTS.LEFT_BORDER + CONSTANTS.BORDER_WIDTH, 
              Math.min(CONSTANTS.RIGHT_BORDER - CONSTANTS.BORDER_WIDTH - GameState.patrulla.width, GameState.patrulla.x));
            GameState.patrulla.targetX = GameState.patrulla.x;
            
            ctx.save();
            const inclineAngle = (Math.random() - 0.5) * 0.3;
            ctx.translate(GameState.patrulla.x + GameState.patrulla.width/2, GameState.patrulla.y + GameState.patrulla.height/2);
            ctx.rotate(inclineAngle);
            ctx.translate(-(GameState.patrulla.x + GameState.patrulla.width/2), -(GameState.patrulla.y + GameState.patrulla.height/2));
          }
        } else {
          GameState.patrulla.x += (GameState.patrulla.targetX - GameState.patrulla.x) * 0.2;
        }

        const invulnerable = ahora - GameState.tiempoUltimoChoque < CONSTANTS.INVULNERABLE_TIME;

        if (invulnerable && Math.floor(ahora / 100) % 2 === 0) {
          if (GameState.deslizando) ctx.restore();
          return;
        }

        GameState.frameCount++;
        if (GameState.frameCount % 8 === 0) {
          GameState.currentPatrullaImgIndex = (GameState.currentPatrullaImgIndex + 1) % patrullaImgs.length;
        }

        const imgToDraw = patrullaImgs[GameState.currentPatrullaImgIndex];
        if (imgToDraw && imgToDraw.complete) {
          ctx.drawImage(imgToDraw, Math.round(GameState.patrulla.x), Math.round(GameState.patrulla.y), GameState.patrulla.width, GameState.patrulla.height);
        } else {
          ctx.fillStyle = '#0033aa';
          ctx.fillRect(GameState.patrulla.x, GameState.patrulla.y, GameState.patrulla.width, GameState.patrulla.height);
        }

        if (GameState.escudosRecolectados > 0) {
          const time = Date.now() / 100;
          const flashIntensity1 = 0.5 + 0.5 * Math.sin(time);
          const flashIntensity2 = 0.3 + 0.3 * Math.sin(time + 1);
          
          ctx.save();
          
          const shieldColor = GameState.escudosRecolectados >= 2 ? 'rgba(255, 215, 0, ' : 'rgba(0, 255, 255, ';
          
          ctx.strokeStyle = shieldColor + flashIntensity1 + ')';
          ctx.lineWidth = 3;
          ctx.shadowColor = GameState.escudosRecolectados >= 2 ? 'gold' : 'cyan';
          ctx.shadowBlur = 15 * flashIntensity1;
          
          ctx.beginPath();
          ctx.arc(
            GameState.patrulla.x + GameState.patrulla.width / 2, 
            GameState.patrulla.y + GameState.patrulla.height / 2, 
            35, 0, Math.PI * 2
          );
          ctx.stroke();
          
          ctx.strokeStyle = GameState.escudosRecolectados >= 2 ? 
            'rgba(255, 235, 150, ' + flashIntensity2 + ')' : 
            'rgba(100, 255, 255, ' + flashIntensity2 + ')';
          ctx.lineWidth = 2;
          ctx.shadowBlur = 10 * flashIntensity2;
          ctx.beginPath();
          ctx.arc(
            GameState.patrulla.x + GameState.patrulla.width / 2, 
            GameState.patrulla.y + GameState.patrulla.height / 2, 
            40, 0, Math.PI * 2
          );
          ctx.stroke();
          
          ctx.restore();
        }

        if (GameState.deslizando) ctx.restore();
      }

      function drawNiebla(ctx) {
        if (!GameState.nieblaActiva) return;
        
        const gradient = ctx.createLinearGradient(0, 0, 0, CONSTANTS.CANVAS_HEIGHT);
        gradient.addColorStop(0, 'rgba(200, 200, 200, 0.1)');
        gradient.addColorStop(0.5, 'rgba(200, 200, 200, 0.4)');
        gradient.addColorStop(1, 'rgba(200, 200, 200, 0.7)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, CONSTANTS.CANVAS_WIDTH, CONSTANTS.CANVAS_HEIGHT);
      }

      function drawNoche(ctx) {
        if (!GameState.nocheActiva) return;
        
        ctx.fillStyle = 'rgba(0, 0, 50, 0.5)';
        ctx.fillRect(0, 0, CONSTANTS.CANVAS_WIDTH, CONSTANTS.CANVAS_HEIGHT);
      }

      function drawLluvia(ctx) {
        if (GameState.level >= 6 || GameState.climaActual === 'tormenta' || 
            (GameState.climaActual === 'granizo' && GameState.climaSecundario === 'lluvia')) {
          
          if (Math.random() < 0.3) {
            addParticle(GameState.gotas, {
              x: Math.random() * CONSTANTS.CANVAS_WIDTH,
              y: -10,
              speed: 2 + Math.random() * 5,
              length: 10 + Math.random() * 10
            });
          }

          ctx.strokeStyle = 'rgba(200, 200, 255, 0.7)';
          ctx.lineWidth = 1;
          
          for (let i = GameState.gotas.length - 1; i >= 0; i--) {
            const g = GameState.gotas[i];
            ctx.beginPath();
            ctx.moveTo(g.x, g.y);
            ctx.lineTo(g.x - g.length * 0.3, g.y + g.length);
            ctx.stroke();
            g.y += g.speed;

            if (g.y > CONSTANTS.CANVAS_HEIGHT) {
              GameState.gotas.splice(i, 1);
            }
          }
        }
      }

      function drawHojas(ctx) {
        GameState.hojas.forEach((hoja, i) => {
          ctx.fillStyle = 'rgba(150, 100, 50, 0.7)';
          ctx.beginPath();
          ctx.arc(hoja.x, hoja.y, hoja.size, 0, Math.PI * 2);
          ctx.fill();
          hoja.x += hoja.speedX;
          hoja.y += hoja.speedY;
          if (hoja.y > CONSTANTS.CANVAS_HEIGHT) GameState.hojas.splice(i, 1);
        });
      }

      function drawNieve(ctx) {
        if (GameState.climaActual === 'nieve' || (GameState.climaActual === 'granizo' && GameState.climaSecundario === 'nieve')) {
          GameState.copos.forEach((copo, i) => {
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(copo.x, copo.y, copo.size, 0, Math.PI * 2);
            ctx.fill();
            copo.y += copo.speed;
            copo.x += Math.sin(copo.y * 0.1) * 1.5;
            if (copo.y > CONSTANTS.CANVAS_HEIGHT) GameState.copos.splice(i, 1);
          });
        }
      }

      function drawArena(ctx) {
        GameState.arena.forEach((grano, i) => {
          ctx.fillStyle = 'rgba(194, 178, 128, 0.8)';
          ctx.beginPath();
          ctx.arc(grano.x, grano.y, grano.size, 0, Math.PI * 2);
          ctx.fill();
          grano.y += grano.speed;
          if (grano.y > CONSTANTS.CANVAS_HEIGHT) GameState.arena.splice(i, 1);
        });
      }

      async function drawGranizo(ctx) {
        if (GameState.climaActual !== 'granizo') return;
        
        const ahora = Date.now();
        
        for (let i = GameState.granizos.length - 1; i >= 0; i--) {
          const granizo = GameState.granizos[i];
          
          if (checkCircleCollision(GameState.patrulla, { x: granizo.x, y: granizo.y, size: granizo.size })) {
            if (GameState.escudosRecolectados > 0) {
              GameState.escudosRecolectados--;
              GameState.tiempoBloqueoChalecos = ahora;
              await reproducirSonido(sonidoAntiPowerup);
            } else {
              GameState.vidas--;
              GameState.combo = 0;
              GameState.shakeFrames = 10;
              GameState.tiempoUltimoChoque = ahora;
              
              await reproducirSonido(sonidoGranizoGolpe);
              
              if (GameState.vidas <= 0) {
                gameOverHandler();
              }
            }
            GameState.granizos.splice(i, 1);
            updateHUD();
          }
        }
        
        GameState.granizos.forEach((granizo, i) => {
          ctx.fillStyle = 'rgba(0, 0, 255, 0.8)';
          ctx.beginPath();
          ctx.arc(granizo.x, granizo.y, granizo.size, 0, Math.PI * 2);
          ctx.fill();
          granizo.y += granizo.speed;
          if (granizo.y > CONSTANTS.CANVAS_HEIGHT) GameState.granizos.splice(i, 1);
        });
      }

      function drawRayosVisual(ctx) {
        const ahora = Date.now();
        
        GameState.rayos.forEach(rayo => {
          if (rayo.estado === 'advertencia') {
            const tiempoTranscurrido = ahora - rayo.tiempoInicio;
            const parpadeo = Math.floor(tiempoTranscurrido / 200) % 2 === 0;
            
            if (parpadeo) {
              ctx.save();
              ctx.fillStyle = `rgba(255, 0, 0, ${0.3 + 0.3 * Math.sin(tiempoTranscurrido / 100)})`;
              ctx.beginPath();
              ctx.arc(rayo.x, CONSTANTS.CANVAS_HEIGHT - 20, rayo.ancho/2, 0, Math.PI * 2);
              ctx.fill();
              
              ctx.fillStyle = 'white';
              ctx.font = 'bold 16px Arial';
              ctx.textAlign = 'center';
              ctx.fillText('¡RAYO INMINENTE!', rayo.x, CONSTANTS.CANVAS_HEIGHT - 40);
              ctx.restore();
            }
          } else if (rayo.estado === 'impacto') {
            ctx.save();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.lineWidth = 3;
            ctx.shadowColor = 'cyan';
            ctx.shadowBlur = 15;
            
            ctx.beginPath();
            ctx.moveTo(rayo.x, 0);
            ctx.lineTo(rayo.x, CONSTANTS.CANVAS_HEIGHT);
            ctx.stroke();
            
            for (let i = 0; i < rayo.ramificaciones; i++) {
              const offsetX = (Math.random() - 0.5) * rayo.ancho;
              const startY = Math.random() * CONSTANTS.CANVAS_HEIGHT * 0.7;
              const endY = startY + Math.random() * CONSTANTS.CANVAS_HEIGHT * 0.3;
              
              ctx.beginPath();
              ctx.moveTo(rayo.x, startY);
              ctx.lineTo(rayo.x + offsetX, endY);
              ctx.stroke();
            }
            
            ctx.restore();
          }
        });
        
        GameState.particulasRayos.forEach((p, index) => {
          ctx.fillStyle = p.color.replace('1)', p.alpha + ')');
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
          
          p.x += p.speedX;
          p.y += p.speedY;
          p.alpha -= p.decay;
          p.size *= 0.98;
          
          if (p.alpha <= 0) {
            GameState.particulasRayos.splice(index, 1);
          }
        });
      }

      function drawCrateres(ctx) {
        const ahora = Date.now();
        
        for (let i = GameState.crateres.length - 1; i >= 0; i--) {
          const crater = GameState.crateres[i];
          
          if (ahora - crater.tiempoCreacion > CONSTANTS.CRATER_LIFETIME) {
            GameState.crateres.splice(i, 1);
            continue;
          }
          
          ctx.fillStyle = '#111';
          ctx.beginPath();
          ctx.ellipse(
            crater.x + crater.width/2,
            crater.y + crater.height/2,
            crater.width/2,
            crater.height/2,
            0, 0, Math.PI * 2
          );
          ctx.fill();
          
          ctx.fillStyle = '#333';
          ctx.beginPath();
          ctx.ellipse(
            crater.x + crater.width/2,
            crater.y + crater.height/2,
            crater.width/3,
            crater.height/3,
            0, 0, Math.PI * 2
          );
          ctx.fill();
          
          if (GameState.frameCount % 5 === 0) {
            addParticle(GameState.particulasCrateres, {
              x: crater.x + crater.width/2 + (Math.random() - 0.5) * 10,
              y: crater.y + (Math.random() * 5),
              size: 5 + Math.random() * 10,
              alpha: 0.6,
              speedX: (Math.random() - 0.5) * 0.5,
              speedY: -Math.random() * 1.5,
              decay: 0.01 + Math.random() * 0.02,
              color: 'rgba(100, 100, 100, 0.7)'
            });
          }
        }
        
        GameState.particulasCrateres.forEach((p, index) => {
          ctx.fillStyle = p.color.replace('0.7)', p.alpha + ')');
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
          
          p.x += p.speedX;
          p.y += p.speedY;
          p.alpha -= p.decay;
          p.size *= 0.99;
          
          if (p.alpha <= 0) {
            GameState.particulasCrateres.splice(index, 1);
          }
        });
      }

      function applyShake(ctx) {
        if (GameState.shakeFrames > 0) {
          const intensity = GameState.shakeFrames / CONSTANTS.SHAKE_FRAMES;
          ctx.translate(
            (Math.random() - 0.5) * CONSTANTS.SHAKE_INTENSITY * intensity,
            (Math.random() - 0.5) * CONSTANTS.SHAKE_INTENSITY * intensity
          );
          GameState.shakeFrames--;
        }
      }

      function cleanUpObjects() {
        GameState.objetivos = GameState.objetivos.filter(obj => obj.y < CONSTANTS.CANVAS_HEIGHT);
        GameState.obstacles = GameState.obstacles.filter(obs => obs.y < CONSTANTS.CANVAS_HEIGHT);
        GameState.powerups = GameState.powerups.filter(pw => pw.y < CONSTANTS.CANVAS_HEIGHT);
        GameState.aceites = GameState.aceites.filter(aceite => aceite.y < CONSTANTS.CANVAS_HEIGHT);
        GameState.nitroItems = GameState.nitroItems.filter(item => item.y < CONSTANTS.CANVAS_HEIGHT);
        GameState.vidaItems = GameState.vidaItems.filter(item => item.y < CONSTANTS.CANVAS_HEIGHT);
        GameState.trampaClavosItems = GameState.trampaClavosItems.filter(item => item.y < CONSTANTS.CANVAS_HEIGHT);
        GameState.conos = GameState.conos.filter(cono => cono.y < CONSTANTS.CANVAS_HEIGHT);
      }

      function checkLevelUp() {
        if (GameState.score >= GameState.level * 1000) {
          GameState.level++;
          GameState.speed = Math.min(CONSTANTS.MAX_SPEED, GameState.speed + 0.5);
          GameState.tiempoUltimoLevelUp = Date.now();
          
          if (GameState.level % 3 === 0) {
            GameState.nitroItemInterval = Math.max(5000, GameState.nitroItemInterval - 1000);
          }
          
          if (GameState.level % 5 === 0) {
            GameState.placasParaVida = Math.max(20, GameState.placasParaVida - 5);
          }
          
          updateHUD();
        }
      }

      function spawnClimaticParticles() {
        if (GameState.climaActual === 'viento' && Math.random() < 0.5) {
          addParticle(GameState.hojas, {
            x: Math.random() * CONSTANTS.CANVAS_WIDTH,
            y: -10,
            speedX: (Math.random() - 0.5) * 3,
            speedY: 2 + Math.random() * 3,
            size: 5 + Math.random() * 5
          });
        }
        
        if ((GameState.climaActual === 'nieve' || (GameState.climaActual === 'granizo' && GameState.climaSecundario === 'nieve')) && Math.random() < 0.3) {
          const cantidadCopos = 2 + Math.floor(Math.random() * 3);
          for (let i = 0; i < cantidadCopos; i++) {
            addParticle(GameState.copos, {
              x: Math.random() * CONSTANTS.CANVAS_WIDTH,
              y: -5,
              speed: 1 + Math.random() * 2,
              size: 2 + Math.random() * 3
            });
          }
        }
        
        if (GameState.climaActual === 'arena' && Math.random() < 0.3) {
          addParticle(GameState.arena, {
            x: Math.random() * CONSTANTS.CANVAS_WIDTH,
            y: -5,
            speed: 3 + Math.random() * 4,
            size: 1 + Math.random() * 2
          });
        }
        
        if (GameState.climaActual === 'granizo' && Math.random() < 0.03) {
          addParticle(GameState.granizos, {
            x: Math.random() * CONSTANTS.CANVAS_WIDTH,
            y: -10,
            speed: 5 + Math.random() * 4,
            size: 5 + Math.random() * 5
          });
        }
      }

      function draw() {
        const ctx = gameCanvas.getContext('2d');
        
        ctx.clearRect(0, 0, CONSTANTS.CANVAS_WIDTH, CONSTANTS.CANVAS_HEIGHT);
        
        ctx.save();
        applyShake(ctx);
        
        ctx.fillStyle = fondoPorNivel();
        ctx.fillRect(0, 0, CONSTANTS.CANVAS_WIDTH, CONSTANTS.CANVAS_HEIGHT);
        
        drawNiebla(ctx);
        drawNoche(ctx);
        drawLluvia(ctx);
        drawHojas(ctx);
        drawNieve(ctx);
        drawArena(ctx);
        drawRayosVisual(ctx);
        drawCrateres(ctx);
        
        drawRoadLines(ctx);
        
        drawAceites(ctx);
        drawObstacles(ctx);
        drawObjetivos(ctx);
        drawPowerups(ctx);
        drawNitroItems(ctx);
        drawVidaItems(ctx);
        drawTrampaClavos(ctx);
        drawConos(ctx);
        
        drawHumo(ctx);
        drawDerrapeMarks(ctx);
        
        drawPatrulla(ctx);
        
        ctx.restore();
        
        GameState.pulso += 0.05;
      }

      // ==================== FUNCIONES DE GUARDADO ====================
      function guardarProgreso() {
        const ahora = Date.now();
        if (ahora - GameState.tiempoUltimoGuardado > 10000) {
          try {
            localStorage.setItem('autosave_' + GameState.nombreJugador, JSON.stringify({
              score: GameState.score,
              level: GameState.level,
              highScore: GameState.highScore,
              totalPuntos: GameState.totalPuntos,
              maxCombo: GameState.maxCombo
            }));
            GameState.tiempoUltimoGuardado = ahora;
          } catch (e) {
            console.warn('Error guardando progreso');
          }
        }
      }

      function cargarProgreso() {
        try {
          const datos = JSON.parse(localStorage.getItem('autosave_' + GameState.nombreJugador) || '{}');
          if (datos.score) {
            GameState.score = datos.score;
            GameState.level = datos.level;
            GameState.highScore = datos.highScore || 0;
            GameState.totalPuntos = datos.totalPuntos || 0;
            GameState.maxCombo = datos.maxCombo || 0;
          }
        } catch (e) {}
      }

      // ==================== FUNCIONES DE JUEGO ====================

        GameState.patrulla.x = CONSTANTS.CANVAS_WIDTH / 2 - 20;
        GameState.patrulla.y = CONSTANTS.CANVAS_HEIGHT - 100;
        GameState.patrulla.targetX = CONSTANTS.CANVAS_WIDTH / 2 - 20;
        
        GameState.obstacles = [];
        GameState.objetivos = [];
        GameState.powerups = [];
        GameState.aceites = [];
        GameState.nitroItems = [];
        GameState.vidaItems = [];
        GameState.trampaClavosItems = [];
        GameState.conos = [];
        GameState.humoParticles = [];
        GameState.derrapeMarks = [];
        GameState.rayos = [];
        GameState.crateres = [];
        GameState.particulasRayos = [];
        GameState.particulasCrateres = [];
        GameState.gotas = [];
        GameState.hojas = [];
        GameState.copos = [];
        GameState.arena = [];
        GameState.granizos = [];
        
        GameState.score = 0;
        GameState.level = 1;
        GameState.speed = CONSTANTS.INITIAL_SPEED;
