<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Patrulla Runner Arcade - Optimizado</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      background: #000; 
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: 'Arial', sans-serif;
    }

    @media (min-width: 769px) {
      body { font-family: 'Press Start 2P', cursive; }
    }

    /* Máquina arcade desktop */
    .arcade-machine {
      position: relative;
      width: 800px;
      height: 900px;
      background: #c00;
      border-radius: 20px;
      border: 15px solid #333;
      box-shadow: 0 0 0 10px #555, 0 30px 50px rgba(0,0,0,0.7), inset 0 0 50px rgba(0,0,0,0.5);
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .arcade-screen-container {
      display: flex;
      width: 100%;
      height: 600px;
      position: relative;
    }

    .arcade-screen {
      width: 57%;
      height: 100%;
      background: #000;
      border: 10px solid #333;
      box-shadow: inset 0 0 20px rgba(0,255,255,0.3);
      position: relative;
      overflow: hidden;
    }

    .arcade-info-panel {
      width: 43%;
      height: 100%;
      background: #000;
      border: 10px solid #333;
      border-left: none;
      box-shadow: inset 0 0 20px rgba(0,255,255,0.1);
      padding: 15px;
      color: white;
      display: flex;
      flex-direction: column;
      font-size: 12px;
      overflow: hidden;
    }

    .arcade-bezel {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%"><rect width="100%" height="100%" fill="none" stroke="rgba(0,255,255,0.2)" stroke-width="10"/></svg>');
      pointer-events: none;
      z-index: 10;
    }

    .arcade-title {
      color: #ff0;
      text-shadow: 3px 3px 0 #000;
      margin: 15px 0;
      font-size: 24px;
      text-align: center;
    }

    .arcade-controls {
      display: flex;
      justify-content: space-between;
      width: 100%;
      margin-top: 30px;
    }

    .arcade-button, .arcade-joystick {
      width: 60px; height: 60px;
      background: #333;
      border-radius: 50%;
      border: 5px solid #111;
      box-shadow: inset 0 -5px 10px rgba(0,0,0,0.5), 0 5px 5px rgba(0,0,0,0.3);
      position: relative;
    }

    .arcade-joystick { width: 80px; height: 80px; }

    .arcade-footer {
      margin-top: 20px;
      color: #fff;
      font-size: 12px;
      text-align: center;
      text-shadow: 2px 2px 0 #000;
    }

    /* Panel información desktop */
    .info-item {
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid #333;
    }
    .info-title { color: #ff0; margin-bottom: 5px; font-size: 14px; }
    .info-value { font-size: 16px; margin-bottom: 5px; }
    .progress-container {
      width: 100%; height: 10px;
      background: #333;
      margin-top: 5px;
      border-radius: 5px;
      overflow: hidden;
    }
    .progress-bar { height: 100%; background: #28a745; transition: width 0.3s; }
    .progress-bar.nitro { background: #007bff; }
    .progress-bar.plates { background: #ffc107; }
    .lives-container { display: flex; gap: 5px; margin-top: 5px; }
    .life { width: 15px; height: 15px; background: red; border-radius: 50%; }
    .combo-container {
      margin-top: 10px; padding: 5px;
      background: rgba(255, 215, 0, 0.2);
      border-radius: 5px;
      display: none;
    }
    .combo-value { color: #ff0; font-weight: bold; }

    /* Vista móvil mejorada */
    @media (max-width: 768px) {
      body {
        background: #111;
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
        touch-action: manipulation;
        margin: 0;
        padding: 0;
      }
      
      .arcade-machine { display: none; }
      
      #game-container {
        position: fixed;
        top: 0; left: 0;
        width: 100vw; height: 100vh;
        overflow: hidden;
      }
      
      canvas {
        width: 100vw !important;
        height: 100vh !important;
        display: block;
        object-fit: contain;
      }

      .mobile-hud {
        position: absolute;
        top: 10px;
        left: 0;
        right: 0;
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: flex-start;
        gap: 5px;
        z-index: 20;
        pointer-events: none;
        font-size: 12px;
        padding: 0 10px;
        box-sizing: border-box;
      }

      .mobile-hud-left, .mobile-hud-right {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px;
        max-width: 70%;
      }

      .mobile-hud-right { margin-left: auto; justify-content: flex-end; }

      .mobile-hud-item {
        background: rgba(0, 0, 0, 0.8);
        color: white;
        padding: 8px 12px;
        border-radius: 8px;
        font-size: clamp(10px, 3vw, 14px);
        font-weight: bold;
        text-align: center;
        text-shadow: 1px 1px 2px black;
        white-space: nowrap;
        flex-shrink: 0;
        border: 1px solid rgba(255,255,255,0.2);
        min-width: 44px;
        min-height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .mobile-progress-container {
        width: 100px;
        height: 8px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 4px;
        margin-top: 3px;
        overflow: hidden;
      }

      .mobile-progress-bar {
        height: 100%;
        background: #28a745;
        transition: width 0.3s;
      }
      .mobile-progress-bar.nitro { background: #007bff; }

      .mobile-hud-combo {
        position: absolute;
        top: 70px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(255, 215, 0, 0.9);
        color: black;
        padding: 8px 15px;
        border-radius: 20px;
        font-size: 14px;
        font-weight: bold;
        display: none;
        white-space: nowrap;
        z-index: 25;
        pointer-events: none;
      }

      /* Controles táctiles optimizados */
      .touch-zone {
        position: fixed;
        top: 0;
        bottom: 0;
        width: 25%;
        z-index: 10;
        opacity: 0.2;
        background: transparent;
      }
      
      #left-zone { left: 0; }
      #right-zone { right: 0; }
      
      .direction-btn {
        position: fixed;
        width: 70px;
        height: 70px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.25);
        border: 3px solid rgba(255, 255, 255, 0.6);
        color: white;
        font-size: 30px;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 15;
        touch-action: manipulation;
        user-select: none;
        backdrop-filter: blur(2px);
        box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        transition: transform 0.1s, background 0.1s;
      }
      
      .direction-btn:active {
        transform: scale(0.95);
        background: rgba(255, 255, 255, 0.4);
      }
      
      #btnLeft {
        left: 20px;
        bottom: 100px;
      }
      
      #btnRight {
        right: 20px;
        bottom: 100px;
      }
      
      #btnNitro {
        position: fixed;
        bottom: 100px;
        left: 50%;
        transform: translateX(-50%);
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: rgba(255, 87, 34, 0.8);
        border: 3px solid rgba(255, 255, 255, 0.8);
        color: white;
        font-size: 32px;
        touch-action: manipulation;
        z-index: 15;
        box-shadow: 0 4px 12px rgba(255,87,34,0.4);
        transition: transform 0.1s, background 0.1s;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      
      #btnNitro:active {
        transform: translateX(-50%) scale(0.95);
        background: rgba(255, 87, 34, 1);
      }

      @media (orientation: portrait) {
        #btnLeft { left: 15px; bottom: 120px; }
        #btnRight { right: 15px; bottom: 120px; }
        #btnNitro { bottom: 120px; width: 90px; height: 90px; }
      }
    }

    /* Elementos comunes */
    #game-container { position: relative; }
    canvas { display: block; background: #111; }

    #loading-screen {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: #000;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 100; gap: 20px;
    }
    @media (min-width: 769px) { #loading-screen { background: url('imagenes/cargaInicioPC_1.png') center/cover no-repeat; } }
    @media (max-width: 768px) { #loading-screen { background: url('imagenes/cargaInicioMovil_1.png') center/cover no-repeat; } }
    
    .loading-spinner {
      width: 50px; height: 50px;
      border: 5px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 1s ease-in-out infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: white; font-size: 18px; text-shadow: 0 0 5px #000; }

    #inicio {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 20; gap: 15px; padding: 20px;
      box-sizing: border-box;
      display: none;
    }
    @media (min-width: 769px) { #inicio { background: url('imagenes/fondoComputadora_1.png') center/cover no-repeat, rgba(0,0,0,0.7); background-blend-mode: overlay; } }
    @media (max-width: 768px) { #inicio { background: url('imagenes/fondo_movil_1.png') center/cover no-repeat, rgba(0,0,0,0.7); background-blend-mode: overlay; } }
    
    #inicio h2 { font-size: 28px; color: gold; text-shadow: 0 0 5px #fff; margin-bottom: 10px; text-align: center; }
    #inicio input, #inicio select {
      padding: 12px; font-size: 18px; margin: 5px 0;
      border: none; border-radius: 8px; width: 250px;
      text-align: center; background: #222; color: white;
    }
    #inicio button {
      padding: 12px 25px; font-size: 18px;
      background: #28a745; border: none; border-radius: 8px;
      color: white; cursor: pointer; font-weight: bold;
      transition: transform 0.2s, background 0.2s;
      width: 100%; max-width: 300px; margin: 5px auto;
    }
    #btnActivarSonido { background: #6c757d; margin-bottom: 10px; }

    #gameOverScreen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: none; flex-direction: column; justify-content: center; align-items: center;
      background: rgba(0,0,0,0.9); z-index: 30; gap: 15px;
    }
    #gameOverText { color: red; font-size: 42px; margin-bottom: 10px; text-align: center; text-shadow: 0 0 10px #ff0000; }
    #btnReiniciar {
      padding: 12px 25px; font-size: 18px; background: #ff5722;
      color: white; border: none; border-radius: 8px; cursor: pointer;
      margin-top: 20px; display: none; font-weight: bold;
    }
    .tienda { color: cyan; font-size: 16px; text-align: center; margin: 10px 0; font-weight: bold; }

    .vehicle-selector-container { margin-bottom: 15px; width: 100%; }
    .vehicle-selector {
      display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
    }
    .vehicle-option {
      display: flex; flex-direction: column; align-items: center;
      padding: 10px; border: 2px solid #555; border-radius: 8px;
      cursor: pointer; transition: all 0.2s;
      background: rgba(0,0,0,0.5); width: 100px; text-align: center;
      min-height: 44px;
    }
    .vehicle-option:hover { border-color: gold; background: rgba(255,215,0,0.2); transform: translateY(-3px); }
    .vehicle-option.selected { border-color: cyan; background: rgba(0,255,255,0.2); box-shadow: 0 0 10px rgba(0,255,255,0.5); }
    .vehicle-thumb { width: 50px; height: 30px; object-fit: contain; margin-bottom: 5px; image-rendering: pixelated; }
    .vehicle-option span { font-size: 14px; color: white; text-shadow: 1px 1px 2px black; }
  </style>
</head>
<body>
  <!-- Pantalla de carga -->
  <div id="loading-screen">
    <div class="loading-spinner"></div>
    <div class="loading-text">Cargando...</div>
  </div>

  <!-- Contenedor desktop -->
  <div id="desktop-view">
    <div class="arcade-machine">
      <div class="arcade-title">PATRULLA RUNNER</div>
      <div class="arcade-screen-container">
        <div class="arcade-screen">
          <div id="game-container-desktop">
            <canvas id="game" width="400" height="600"></canvas>
            <div class="arcade-bezel"></div>
          </div>
        </div>
        <div class="arcade-info-panel">
          <div class="info-item"><div class="info-title">POLICÍA</div><div class="info-value" id="desktop-player">-</div></div>
          <div class="info-item"><div class="info-title">PUNTOS</div><div class="info-value" id="desktop-score">0</div></div>
          <div class="info-item"><div class="info-title">NIVEL</div><div class="info-value" id="desktop-level">1</div></div>
          <div class="info-item"><div class="info-title">PRÓX. NIVEL</div><div class="progress-container"><div class="progress-bar" id="desktop-level-progress" style="width: 0%"></div></div></div>
          <div class="info-item"><div class="info-title">RÉCORD</div><div class="info-value" id="desktop-highscore">0</div></div>
          <div class="info-item"><div class="info-title">NITRO</div><div class="progress-container"><div class="progress-bar nitro" id="desktop-nitro-progress" style="width: 100%"></div></div></div>
          <div class="info-item"><div class="info-title">VIDAS</div><div class="lives-container" id="desktop-lives"><div class="life"></div><div class="life"></div><div class="life"></div></div></div>
          <div class="info-item"><div class="info-title">PLACAS PARA VIDA</div><div class="info-value" id="desktop-plates">0/50</div><div class="progress-container"><div class="progress-bar plates" id="desktop-plates-progress" style="width: 0%"></div></div></div>
          <div class="info-item"><div class="info-title">ESCUDOS</div><div class="info-value" id="desktop-shields">0/2</div><div class="progress-container"><div class="progress-bar" id="desktop-shields-progress" style="width: 0%; background: cyan"></div></div></div>
          <div class="combo-container" id="desktop-combo-container"><div class="info-title">COMBO ACTIVO</div><div class="combo-value" id="desktop-combo">x1</div></div>
        </div>
      </div>
      <div class="arcade-controls"><div class="arcade-joystick"></div><div class="arcade-button"></div><div class="arcade-button"></div></div>
      <div class="arcade-footer">© 2024 POLICIA ARCADE</div>
    </div>
  </div>

  <!-- Versión móvil -->
  <div id="mobile-view" style="display: none;">
    <div id="game-container">
      <canvas id="game-mobile" width="400" height="600"></canvas>
      
      <div class="mobile-hud">
        <div class="mobile-hud-left">
          <div class="mobile-hud-item" id="mobile-player">👮‍♂️: -</div>
          <div class="mobile-hud-item" id="mobile-lives">♥️: 3</div>
          <div class="mobile-hud-item" id="mobile-score">💎: 0</div>
          <div class="mobile-hud-item" id="mobile-shields">🛡️: 0/2</div>
          <div class="mobile-hud-item" id="mobile-plates">🟡: 0/50</div>
        </div>
        <div class="mobile-hud-right">
          <div class="mobile-hud-item" id="mobile-level">🏆: 1</div>
          <div class="mobile-hud-item">
            <div>🚩: 0%</div>
            <div class="mobile-progress-container"><div class="mobile-progress-bar" id="mobile-next-level-bar" style="width: 0%"></div></div>
          </div>
          <div class="mobile-hud-item">
            <div>⚡: 100%</div>
            <div class="mobile-progress-container"><div class="mobile-progress-bar nitro" id="mobile-nitro-bar" style="width: 100%"></div></div>
          </div>
        </div>
      </div>
      
      <div class="mobile-hud-combo" id="mobile-combo">COMBO x1</div>
      
      <!-- Zonas táctiles optimizadas -->
      <div id="left-zone" class="touch-zone"></div>
      <div id="right-zone" class="touch-zone"></div>
      
      <!-- Botones direccionales -->
      <div id="btnLeft" class="direction-btn">←</div>
      <div id="btnRight" class="direction-btn">→</div>
      <button id="btnNitro">💨</button>
    </div>
  </div>

  <!-- Elementos comunes -->
  <div id="inicio">
    <h2>Patrulla Runner</h2>
    <button id="btnActivarSonido">🔊 Activar Sonido</button>
    <input id="nombreJugador" type="text" placeholder="Tu nombre..." maxlength="20" pattern="[A-Za-z0-9 ]+" />
    
    <div class="vehicle-selector-container">
      <label style="color: white; margin-bottom: 5px; display: block; text-align: center;">Selecciona tu vehículo:</label>
      <div class="vehicle-selector">
        <div class="vehicle-option" data-value="imagenes/patrulla_1.png"><img src="imagenes/patrulla_1.png" alt="Patrulla de Cuadrante" class="vehicle-thumb"><span>Cuadrante</span></div>
        <div class="vehicle-option" data-value="imagenes/transito_1.png"><img src="imagenes/transito_1.png" alt="Patrulla de Tránsito" class="vehicle-thumb"><span>Tránsito</span></div>
        <div class="vehicle-option" data-value="imagenes/pbi_1.png"><img src="imagenes/pbi_1.png" alt="Patrulla P.B.I." class="vehicle-thumb"><span>P.B.I.</span></div>
        <div class="vehicle-option" data-value="imagenes/auxiliar_1.png"><img src="imagenes/auxiliar_1.png" alt="Patrulla Auxiliar" class="vehicle-thumb"><span>P.A.</span></div>
      </div>
      <input type="hidden" id="colorPatrulla" value="imagenes/patrulla_1.png">
    </div>
    
    <div class="tienda"><div id="puntosTotales"></div></div>
    <button onclick="iniciarJuego()">🚀 Jugar</button>
  </div>

  <div id="gameOverScreen">
    <div id="gameOverText">¡Patrullaje Fallido!</div>
    <div id="puntosFinales"></div>
    <div id="highScoreFinal"></div>
    <div id="maxComboFinal"></div>
    <button id="btnReiniciar">🔄 Volver a Patrullar</button>
  </div>

  <script>
    (function() {
      'use strict';

      // ==================== CONFIGURACIÓN ====================
      const CONFIG = {
        CANVAS_WIDTH: 400,
        CANVAS_HEIGHT: 600,
        LEFT_BORDER: 40,
        RIGHT_BORDER: 360,
        BORDER_WIDTH: 8,
        LINE_POSITIONS: [120, 200, 280],
        LINE_HEIGHT: 30,
        LINE_GAP: 50,
        INITIAL_SPEED: 5,
        MAX_SPEED: 15,
        NITRO_BOOST: 3,
        NITRO_CONSUME_RATE: 1, // por 50ms
        NITRO_REGEN: 0.2,
        MAX_ESCUDOS: 2,
        TIEMPO_INVULNERABLE: 1000,
        TIEMPO_DESLIZAMIENTO_MAX: 1000,
        TIEMPO_RESET_COMBO: 3000,
        PLACAS_PARA_VIDA_BASE: 50,
        SCORE_PER_LEVEL: 1000,
        MAX_PARTICULAS: 100,
        MAX_DERRAPE_MARKS: 10,
        NITRO_ITEM_INTERVALO_BASE: 15000
      };

      // ==================== DETECCIÓN DISPOSITIVO ====================
      const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      const desktopView = document.getElementById('desktop-view');
      const mobileView = document.getElementById('mobile-view');
      const gameCanvas = isMobile ? document.getElementById('game-mobile') : document.getElementById('game');
      
      if (isMobile) {
        desktopView.style.display = 'none';
        mobileView.style.display = 'block';
      } else {
        desktopView.style.display = 'block';
        mobileView.style.display = 'none';
      }

      // ==================== ESTADO GLOBAL ====================
      const state = {
        // Jugador
        nombreJugador: '',
        patrulla: { x: 180, y: CONFIG.CANVAS_HEIGHT - 100, width: 40, height: 60, targetX: 180 },
        patrullaImgs: [],
        currentPatrullaImgIndex: 0,
        frameCount: 0,
        
        // Puntuación
        score: 0,
        highScore: 0,
        level: 1,
        vidas: 3,
        escudosRecolectados: 0,
        nitro: 100,
        nitroActivo: false,
        combo: 0,
        maxCombo: 0,
        placasRecolectadasDesdeUltimaVida: 0,
        placasParaVida: CONFIG.PLACAS_PARA_VIDA_BASE,
        
        // Tiempos
        tiempoUltimaPlaca: 0,
        tiempoUltimoChoque: 0,
        tiempoDeslizamiento: 0,
        tiempoBloqueoChalecos: 0,
        tiempoUltimoLevelUp: 0,
        tiempoUltimoNitroItem: 0,
        tiempoUltimoGuardado: 0,
        
        // Estados
        gameOver: false,
        juegoPausado: false,
        deslizando: false,
        invulnerable: false,
        nitroSoundPlaying: false,
        sonidoActivado: false,
        
        // Colecciones de objetos
        obstacles: [],
        objetivos: [],
        powerups: [],
        aceites: [],
        nitroItems: [],
        vidaItems: [],
        trampaClavosItems: [],
        conos: [],
        
        // Efectos
        humoParticles: [],
        derrapeMarks: [],
        gotas: [],
        hojas: [],
        copos: [],
        arena: [],
        granizos: [],
        rayos: [],
        crateres: [],
        particulasRayos: [],
        particulasCrateres: [],
        
        // Clima
        climaActual: 'normal',
        climaSecundario: null,
        tiempoCambioClima: 0,
        tiempoDuracionClima: 0,
        nieblaActiva: false,
        nocheActiva: false,
        vientoActivo: false,
        ultimoTrueno: 0,
        
        // Otros
        speed: CONFIG.INITIAL_SPEED,
        lineOffset: 0,
        pulso: 0,
        shakeFrames: 0,
        nitroItemIntervalo: CONFIG.NITRO_ITEM_INTERVALO_BASE
      };

      // ==================== RECURSOS (IMÁGENES) ====================
      const images = {
        loadingDesktop: new Image(),
        loadingMobile: new Image(),
        cono: new Image(),
        crater: new Image(),
        placaPolicia: new Image(),
        barrera: new Image(),
        powerup: new Image(),
        nitroItem: new Image(),
        vidaItem: new Image(),
        trampaClavos: new Image(),
        fondoInicioDesktop: new Image(),
        fondoInicioMovil: new Image()
      };

      images.placaPolicia.src = 'imagenes/placaPolicia_1.png';
      images.barrera.src = 'imagenes/barrera_1.png';

      // ==================== SONIDOS ====================
      const sounds = {
        punto: new Audio('sonidos/estrella_1.mp3'),
        choque: new Audio('sonidos/choque_1.mp3'),
        powerup: new Audio('sonidos/powerup_1.mp3'),
        antiPowerup: new Audio('sonidos/anti_powerup.mp3'),
        aceite: new Audio('sonidos/aceite.mp3'),
        nitro: new Audio('sonidos/nitro_1.mp3'),
        vida: new Audio('sonidos/vida_1.mp3'),
        frenoDerrape: new Audio('sonidos/freno_1.mp3'),
        trampaClavos: new Audio('sonidos/trampaclavos_1.mp3'),
        cono: new Audio('sonidos/choque_1.mp3'),
        trueno: new Audio('sonidos/trueno.mp3'),
        impactoRayo: new Audio('sonidos/rayo_1.mp3'),
        viento: new Audio('sonidos/viento.mp3'),
        nieve: new Audio('sonidos/nieve.mp3'),
